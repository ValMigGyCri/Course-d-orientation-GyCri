    return `<p class="muted">${vide[tab]}</p>`;
  }
  const cfg=S.config, libre=isFree(), pts=isPoints();
  let rows;
  if(tab==='classee') rows=rankTeams(list,cfg);
  else if(tab==='active') rows=list.slice().sort((a,b)=>(avancement(b)-avancement(a)) || ((a.start||8.64e15)-(b.start||8.64e15)) || String(a.name).localeCompare(String(b.name),'fr')).map(t=>({t}));
  else rows=list.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'fr')).map(t=>({t}));
  const ncol=(tab==='classee'?1:0)+1+(libre?0:1)+1+(pts?1:0)+(tab==='active'?1:0)+2;
  return `<div class="tablewrap"><table>
    <tr>${tab==='classee'?'<th>Rang</th>':''}<th>Équipe</th>${libre?'':'<th class="col-opt">Parcours</th>'}<th class="num">Postes</th>${pts?'<th class="num">Score</th>':''}${tab==='active'?'<th class="col-opt">Dernier</th>':''}<th>Temps</th><th></th></tr>
    ${rows.map(x=>suiviRow(x.t, tab, x.rank, ncol)).join('')}
  </table></div>
  <p class="muted small-txt" style="margin-top:8px">Touchez &#8943; pour les actions d'une équipe : valider un poste à sa place, la classer, la remettre en course, la mettre hors classement…${window.innerWidth<560? ' Tournez le téléphone à l\u2019horizontale pour voir toutes les colonnes.':''}</p>`;
}
function suiviRow(t, tab, rank, ncol){
  const cfg=S.config, libre=isFree(), pts=isPoints();
  const c=libre? null : teamCourse(t,cfg);
  const total=libre? collectPosts(cfg).length : (c? c.steps.length : 0);
  const s=scoreOf(t,cfg);
  const done=libre? s.collected : stepsDone(t,c);
  const tags=[];
  if(t.left) tags.push('<span class="tag mute">a quitté</span>');
  if(!t.start && t.end==null) tags.push('<span class="tag mute">pas partie</span>');
  if(t.end!=null && t.endMethod==='organisateur') tags.push('<span class="tag info">close par vous</span>');
  if(t.end!=null && t.endMethod==='manuel') tags.push('<span class="tag mute">fin manuelle</span>');
  if(libre && t.finalOk) tags.push('<span class="tag ok">énigme &#10003;</span>');
  let temps='—';
  if(t.start){
    if(t.end!=null) temps=fmtT(t.end-t.start)+(libre && s.lateMin? ' <span class="tag warn">+'+s.lateMin+' min</span>':'');
    else temps=`<span class="live" data-start="${t.start}"${libre? ' data-dl="'+deadlineOf(t,cfg)+'"':''}>…</span>`;
  }
  const last=(t.scans||[]).length? fmtClock(Math.max(...t.scans.map(x=>x.t||0))) : '—';
  const open=S.openTeam===t.id;
  return `<tr class="${open?'sel':''}">
    ${tab==='classee'? `<td><span class="rank${rank<=3?' r'+rank:''}">${rank}</span></td>`:''}
    <td><b>${esc(t.name)}</b> ${tags.join(' ')}</td>
    ${libre? '' : `<td class="col-opt">${c? esc(c.name) : '<span class="muted">?</span>'}</td>`}
    <td class="num">${done}/${total}</td>
    ${pts? `<td class="num"><b>${s.total}</b>${s.penalty? '<br><span class="muted small-txt">dont &minus;'+s.penalty+'</span>':''}</td>`:''}
    ${tab==='active'? `<td class="mono col-opt">${last}</td>`:''}
    <td class="mono">${temps}</td>
    <td style="text-align:right"><button class="small ghost" onclick="toggleTeamPanel('${t.id}')" aria-label="Actions de l'équipe">${open?'&#9652;':'&#8943;'}</button></td>
  </tr>
  ${open? `<tr class="actrow"><td colspan="${ncol}">${teamPanel(t)}</td></tr>`:''}`;
}
function endLabel(m){
  return {arrivee:'arrivée validée', parcours:'dernier poste validé', manuel:'bouton « Terminer »', organisateur:'close par l\u2019organisateur'}[m]||'fin';
}
function teamPanel(t){
  const cfg=S.config, st=teamStatus(t), libre=isFree(), pts=isPoints();
  const met={}; (t.scans||[]).forEach(x=>{ const m=x.method||'qr'; met[m]=(met[m]||0)+1; });
  const lib={qr:'QR',gps:'GPS',code:'code',organisateur:'par vous'};
  const det=[t.start? 'Départ '+fmtClock(t.start) : 'Pas encore partie'];
  if(t.end!=null) det.push('Fin '+fmtClock(t.end)+' ('+endLabel(t.endMethod)+')');
  if(Object.keys(met).length) det.push('Validations : '+Object.entries(met).map(([k,v])=>v+' '+(lib[k]||k)).join(' · '));
  if(t.created) det.push('Inscrite le '+fmtDateTime(t.created));
  const s=scoreOf(t,cfg);
  let score='';
  if(pts) score=`<p class="small-txt">Score : ${s.postsPts} pts de postes${s.enigme? ' + '+s.enigme+' pts d\u2019énigme':''}${s.penalty? ' &minus; '+s.penalty+' de retard ('+s.lateMin+' min)':''} = <b>${s.total}</b>${s.provisional? ' (provisoire)':''}</p>`;
  else if(libre && s.lateMin) score=`<p class="small-txt">Hors délai : ${s.lateMin} min de retard.</p>`;
  const credit=(t.end==null && st!=='hc')? creditBlock(t) : '';
  const btn=(lbl,fn,cls)=>`<button class="small ${cls||''} fix" onclick="${fn}">${lbl}</button>`;
  const actions=[];
  if(st==='active') actions.push(btn('Terminer et classer',`closeTeam('${t.id}')`,'primary'));
  if(t.end!=null) actions.push(btn('Remettre en course',`reopenTeam('${t.id}')`));
  actions.push(st==='hc'? btn('Réintégrer au classement',`setHC('${t.id}',false)`) : btn('Hors classement',`setHC('${t.id}',true)`,'ghost'));
  actions.push(btn('Remettre à zéro',`resetOneTeam('${t.id}')`,'ghost'));
  actions.push(btn('Supprimer',`delOneTeam('${t.id}')`,'danger'));
  return `<div class="stack">
    <p class="small-txt">${esc(det.join(' — '))}</p>
    ${score}${credit}
    <div class="row wrap">${actions.join('')}</div>
  </div>`;
}
/* Validation d'un poste à la place d'une équipe bloquée */
function creditBlock(t){
  const cfg=S.config;
  if(!isFree()){
    const c=teamCourse(t,cfg);
    if(!c) return '<p class="muted small-txt">Parcours introuvable : impossible de valider un poste pour cette équipe.</p>';
    const k=progressIndex(t,c);
    if(k>=c.steps.length) return '';
    const pid=c.steps[k].postId;
    /* En ordre imposé, seul le poste attendu peut être validé : sinon la suite des indices se désynchroniserait. */
    return `<div class="row wrap"><span class="small-txt">Poste attendu : <b>${esc(postName(pid))}</b> (n° ${k+1})</span>
      <button class="small fix" onclick="creditPost('${t.id}','${pid}')">Valider ce poste</button></div>`;
  }
  const v=validatedIds(t), a=arrivalId(cfg);
  const dispo=collectPosts(cfg).filter(p=>!v.has(p.id));
  const sel=(S.creditSel||{})[t.id];
  return `<div class="stack">
    ${dispo.length? `<div class="row wrap">
      <select id="credit-${t.id}" onchange="(S.creditSel=S.creditSel||{})['${t.id}']=this.value">${dispo.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      <button class="small fix" onclick="creditPost('${t.id}',(el('credit-${t.id}')||{}).value)">Valider ce poste</button></div>`
      : '<p class="muted small-txt">Tous les postes sont validés.</p>'}
    ${a? `<div><button class="small fix" onclick="creditArrival('${t.id}')">Valider l\u2019arrivée maintenant</button></div>`:''}
  </div>`;
}
/* Toutes les actions de l'organisateur partent de la version la plus fraîche
   de la fiche et n'écrasent jamais une validation faite entre-temps. */
async function teamAction(id, mutate){
  try{
    const r=await updateTeam(teamKey(S.raceId,id), mutate);
    if(!r) alert('Équipe introuvable : elle a peut-être été supprimée.');
  }catch(e){ alert('Action impossible (base injoignable) : '+e.message); }
  await refreshSuivi(true);
}
async function creditPost(id, postId){
  const p=postId? postById(postId) : null; if(!p) return;
  if(!confirm('Valider « '+p.name+' » pour cette équipe ? Le passage sera horodaté maintenant et marqué « validé par l\u2019organisateur ».')) return;
  await teamAction(id, t=>{
    if((t.scans||[]).some(x=>x.postId===postId)) return false;
    const now=Date.now();
    if(!t.start) t.start=now;
    t.scans=t.scans||[];
    t.scans.push({postId, t:now, method:'organisateur'});
    if(!isFree()){
      const c=teamCourse(t,S.config);
      if(c && isCourseComplete(t,c) && t.end==null){ t.end=now; t.endMethod='parcours'; touch(t,'end',now); }
    }
  });
}
async function creditArrival(id){
  const a=arrivalId(); if(!a) return;
  if(!confirm('Valider l\u2019arrivée de cette équipe maintenant ? Son chrono s\u2019arrête à cet instant.')) return;
  await teamAction(id, t=>{
    if(t.end!=null) return false;
    const now=Date.now();
    if(!t.start) t.start=now;
    t.scans=t.scans||[];
    if(!t.scans.some(x=>x.postId===a)) t.scans.push({postId:a, t:now, method:'organisateur'});
    t.end=now; t.endMethod='organisateur'; touch(t,'end',now);
  });
}
async function closeTeam(id){
  if(!confirm('Arrêter le chrono de cette équipe maintenant et la classer ?'+(isPoints()? ' Le retard éventuel sera décompté jusqu\u2019à cet instant.':''))) return;
  await teamAction(id, t=>{
    if(t.end!=null) return false;
    const now=Date.now();
    if(!t.start) t.start=now;
    t.end=now; t.endMethod='organisateur'; touch(t,'end',now);
  });
}
async function reopenTeam(id){
  if(!confirm('Remettre cette équipe en course ? Son chrono reprend depuis son départ.')) return;
  await teamAction(id, t=>{
    t.end=null; t.endMethod=null; touch(t,'end');
    if(t.statut==='hc'){ t.statut=null; t.left=null; touch(t,'statut'); }
  });
}
async function setHC(id,on){
  await teamAction(id, t=>{ t.statut=on? 'hc' : null; if(!on) t.left=null; touch(t,'statut'); });
}
async function resetOneTeam(id){
  if(!confirm('Remettre cette équipe à zéro ? Son chrono et ses validations seront effacés ; elle repartira de zéro sous le même nom.')) return;
  await teamAction(id, t=>{
    const now=Date.now();
    t.epoch=(t.epoch||0)+1;
    t.start=null; t.end=null; t.endMethod=null; t.scans=[]; t.finalOk=false; t.statut=null; t.left=null;
    touch(t,'end',now); touch(t,'finalOk',now); touch(t,'statut',now);
  });
}
async function delOneTeam(id){
  const t=S.allTeams.find(x=>x.id===id);
  if(!confirm('Supprimer définitivement l\u2019équipe « '+(t?t.name:'')+' » ?')) return;
  try{ await tombstoneTeam(teamKey(S.raceId,id), id); }
  catch(e){ alert('Suppression impossible : '+e.message); return; }
  if(S.openTeam===id) S.openTeam=null;
  await refreshSuivi(true);
}
/* Inscriptions jamais parties (double appui, équipe qui a changé de nom…).
   Celles de moins de 10 minutes sont épargnées : elles font peut-être leur test. */
async function cleanupTeams(){
  const now=Date.now();
  const vides=S.allTeams.filter(t=>!t.start && !(t.scans||[]).length && t.end==null && (!t.created || now-t.created>10*60000));
  if(!vides.length){ alert('Aucune inscription vide à nettoyer. Les inscriptions de moins de 10 minutes sont conservées : l\u2019équipe est peut-être en train de faire son test de localisation.'); return; }
  if(!confirm(vides.length+' inscription'+(vides.length>1?'s':'')+' sans départ ni poste validé : '+vides.map(t=>t.name).join(', ')+'. Les supprimer ?')) return;
  for(const t of vides){
    try{ await tombstoneTeam(teamKey(S.raceId,t.id), t.id); }
    catch(e){ alert('Nettoyage interrompu : '+e.message); break; }
  }
  await refreshSuivi(true);
}
async function resetTeams(){
  if(!confirm('Supprimer TOUTES les équipes de cette course, avec leurs temps ? Exportez d\u2019abord les résultats en CSV si besoin.')) return;
  if(!confirm('Dernière confirmation : suppression définitive de toutes les équipes ?')) return;
  try{
    for(const k of await stKeysStrict('co:team:'+S.raceId+':')) await tombstoneTeam(k, k.split(':').pop());
  }catch(e){ alert('Suppression interrompue : '+e.message); }
  S.openTeam=null;
  await refreshSuivi(true);
}
function tickSuivi(){
  const now=Date.now();
  document.querySelectorAll('#suiviTable .live').forEach(x=>{
    const st=Number(x.dataset.start); if(!st) return;
    if(x.dataset.dl){ const r=Number(x.dataset.dl)-now; x.textContent=fmtSigned(r); x.style.color=r<0? 'var(--err)' : ''; }

function updateSuiviInfo(){
  const i=el('suiviInfo'); if(!i) return;
  const parts=[];
  if(S.suiviErr) parts.push('\u26A0 base injoignable');
  if(S.suiviAt) parts.push('mis à jour à '+fmtClock(S.suiviAt));
  parts.push('actualisation auto. 20 s');

/* ---- Vue schématique ---- */
function postPositions(teams){
  const acc={};
  teams.forEach(t=>(t.scans||[]).forEach(s=>{ if(s.lat==null||s.lon==null) return; (acc[s.postId]=acc[s.postId]||[]).push(s); }));
  const out={};
  for(const pid in acc){
    if(!postById(pid)) continue;
    const pts=acc[pid];
    out[pid]={lat:pts.reduce((a,p)=>a+Number(p.lat),0)/pts.length, lon:pts.reduce((a,p)=>a+Number(p.lon),0)/pts.length, n:pts.length};
  }
  /* Les coordonnées saisies par l'organisateur priment sur la moyenne des validations */
  S.config.posts.forEach(p=>{ if(hasGpsCoords(p)) out[p.id]={lat:Number(p.lat), lon:Number(p.lon), n:(out[p.id]?out[p.id].n:0)}; });
  return out;
}
function drawSchematic(teams){
  const box=el('schematic'); if(!box) return;
  const posts=postPositions(teams);
  const equipes=teams.filter(t=>teamStatus(t)!=='hc').map(t=>{
    const g=(t.scans||[]).filter(s=>s.lat!=null&&s.lon!=null).sort((a,b)=>(a.t||0)-(b.t||0)).pop();
    return g? {name:t.name, lat:Number(g.lat), lon:Number(g.lon), done:t.end!=null} : null;
  }).filter(Boolean);
  const tous=[...Object.values(posts), ...equipes];
  if(!tous.length){ box.innerHTML='<p class="muted">Aucune position pour l\u2019instant : les points apparaîtront avec les coordonnées des postes ou les premières validations GPS.</p>'; return; }
  const lat0=tous.reduce((a,p)=>a+p.lat,0)/tous.length;
  const kx=Math.cos(lat0*Math.PI/180);
  const W=720, H=440, pad=42;
  const xs=tous.map(p=>p.lon*kx), ys=tous.map(p=>p.lat);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const spanX=Math.max(maxX-minX,1e-5), spanY=Math.max(maxY-minY,1e-5);
  /* Même échelle sur les deux axes : le plan n'est pas déformé */
  const sc=Math.min((W-2*pad)/spanX, (H-2*pad)/spanY);
  const ox=(W-spanX*sc)/2, oy=(H-spanY*sc)/2;
  const X=lon=>ox+(lon*kx-minX)*sc, Y=lat=>H-(oy+(lat-minY)*sc);
  const a=arrivalId();
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan schématique des postes et des équipes" style="width:100%;border:1.5px dashed var(--line);border-radius:10px;background:#FDFCF8">`;
  for(const pid in posts){
    const p=posts[pid], x=X(p.lon), y=Y(p.lat);
    if(pid===a) svg+=`<circle cx="${x}" cy="${y}" r="9" fill="#fff" stroke="#1D5C42" stroke-width="2"/><circle cx="${x}" cy="${y}" r="5" fill="#1D5C42"/>`;
    else svg+=`<rect x="${x-6}" y="${y-6}" width="12" height="12" rx="2" fill="#fff" stroke="#1E2420" stroke-width="1.5"/><path d="M${x-6},${y+6} L${x+6},${y-6} L${x+6},${y+6} Z" fill="#E8590C"/>`;
    svg+=`<text x="${x}" y="${y-12}" font-size="11" font-family="Archivo,sans-serif" text-anchor="middle" fill="#1E2420">${esc(postName(pid))}</text>`;
  }
  equipes.forEach(t=>{
    const x=X(t.lon), y=Y(t.lat);
    svg+=`<circle cx="${x}" cy="${y}" r="6" fill="${t.done?'#1D7A46':'#E8590C'}" stroke="#1E2420" stroke-width="1.5"/>
      <text x="${x}" y="${y+19}" font-size="11" font-weight="bold" font-family="Archivo,sans-serif" text-anchor="middle" fill="#1E2420">${esc(t.name)}</text>`;
  });
  /* Barre d'échelle et nord */
  const mParPx=111320/sc;
  const L=[5000,2000,1000,500,200,100,50,20,10,5].find(m=>m/mParPx<=180);
  if(L && L/mParPx>=12){
    const lpx=L/mParPx;
    svg+=`<line x1="20" y1="${H-16}" x2="${20+lpx}" y2="${H-16}" stroke="#1E2420" stroke-width="3"/>
      <text x="${20+lpx/2}" y="${H-23}" font-size="11" font-family="Archivo,sans-serif" text-anchor="middle">${L>=1000? (L/1000)+' km' : L+' m'}</text>`;
  }
  svg+=`<text x="${W-18}" y="26" font-size="13" font-weight="bold" text-anchor="end" font-family="Archivo,sans-serif">N &#8593;</text></svg>`;
  box.innerHTML=svg;
}

/* ---- Exports ---- */
function statusLabel(t){ return {active:'en course', classee:'classée', hc:'hors classement'}[teamStatus(t)]; }
function exportCSV(){
  const teams=S.allTeams||[], cfg=S.config, pts=isPoints(), libre=isFree(), a=arrivalId();
  const enigme=libre && String(cfg.finalAnswer||'').trim()!=='';
  const L=[];
  L.push(['equipe','statut','parcours','ordre','poste','methode','points','heure_passage','temps_course','latitude','longitude','precision_m'].join(';'));
  teams.forEach(t=>{
    const c=teamCourse(t,cfg);
    (t.scans||[]).slice().sort((x,y)=>(x.t||0)-(y.t||0)).forEach((s,i)=>{
      const p=postById(s.postId,cfg);
      L.push([csvCell(t.name,true), csvCell(statusLabel(t)), csvCell(libre? TYPE_LABELS[raceType()] : (c?c.name:'?'),true), csvCell(i+1),
        csvCell(postName(s.postId)+(s.postId===a?' (arrivée)':''),true), csvCell(s.method||'qr'),
        csvCell(pts && p && s.postId!==a? postPoints(p) : ''), csvCell(fmtClock(s.t)), csvCell(t.start? fmtT(s.t-t.start) : ''),
        csvCell(s.lat??''), csvCell(s.lon??''), csvCell(s.acc??'')].join(';'));
    });
  });
  L.push('');
  L.push(csvCell('CLASSEMENT'));
  const head=['rang','equipe','statut'];
  if(!libre) head.push('parcours');
  head.push('postes');
  if(pts) head.push('points_postes');
  if(enigme) head.push('enigme_resolue');
  if(pts) head.push('points_enigme');
  if(libre) head.push('retard_min');
  if(pts) head.push('penalite','score');
  head.push('depart','fin','fin_par','temps_total');
  L.push(head.join(';'));
  const classees=rankTeams(teams.filter(t=>teamStatus(t)==='classee'),cfg);
  const autres=teams.filter(t=>teamStatus(t)!=='classee').map(t=>({t,rank:''}));
  [...classees, ...autres].forEach(({t,rank})=>{
    const c=teamCourse(t,cfg), s=scoreOf(t,cfg);
    const done=libre? s.collected : stepsDone(t,c), total=libre? collectPosts(cfg).length : (c?c.steps.length:0);
    const cols=[csvCell(rank), csvCell(t.name,true), csvCell(statusLabel(t))];
    if(!libre) cols.push(csvCell(c?c.name:'?',true));
    cols.push(csvCell(done+'/'+total));
    if(pts) cols.push(csvCell(s.postsPts));
    if(enigme) cols.push(csvCell(t.finalOk?'oui':'non'));
    if(pts) cols.push(csvCell(s.enigme));
    if(libre) cols.push(csvCell(s.lateMin));
    if(pts) cols.push(csvCell(s.penalty), csvCell(s.total));
    cols.push(csvCell(t.start? fmtClock(t.start):''), csvCell(t.end!=null? fmtClock(t.end):''),
      csvCell(t.end!=null? endLabel(t.endMethod):''), csvCell(t.start&&t.end!=null? fmtT(t.end-t.start):''));
    L.push(cols.join(';'));
  });
  download(safeName(cfg.title)+'-resultats.csv','text/csv;charset=utf-8','\ufeff'+L.join('\r\n')+'\r\n');
}
const xmlEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function exportGPX(){
  const teams=S.allTeams||[], cfg=S.config, posts=postPositions(teams);
  let g='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Balise" xmlns="http://www.topografix.com/GPX/1/1">\n';

    g+='<trk><name>'+xmlEsc(t.name)+'</name><desc>'+xmlEsc(desc)+'</desc><trkseg>\n';
    pts.forEach(s=>{ g+='<trkpt lat="'+Number(s.lat).toFixed(6)+'" lon="'+Number(s.lon).toFixed(6)+'"><time>'+new Date(s.t).toISOString()+'</time><name>'+xmlEsc(postName(s.postId))+'</name></trkpt>\n'; });
    g+='</trkseg></trk>\n';
  });
  g+='</gpx>\n';
  download(safeName(cfg.title)+'.gpx','application/gpx+xml',g);
}

/* =====================================================================
   ESPACE COUREUR — inscription et reprise de session
   ===================================================================== */
function backHome(){ return `<button class="ghost small" onclick="S.raceId=null;go('home')">&larr; Accueil</button>`; }
/* Reprise : 'ok' (équipe retrouvée), 'gone' (équipe ou course disparue),
   'offline' (base injoignable et aucune copie locale : écran d'erreur affiché) */
async function resumeSession(me){
  const key=teamKey(me.raceId, me.teamId);
  /* Validations en attente capturées AVANT toute requête : l'envoi de la file
     au démarrage peut les vider pendant la reprise. */
  const enAttente=(pending[key]&&pending[key].kind==='team')? clone(pending[key].v) : null;
  let t, cfg;
  try{
    t=await stGetStrict(key);
    cfg=await stGetStrict('co:race:'+me.raceId);
  }catch(e){
    /* Hors ligne : on repart de la copie conservée sur le téléphone */
    const c=readRunnerCache(me.raceId, me.teamId);
    if(c){
      S.raceId=me.raceId; S.config=ensureConfigShape(c.config);
      S.team=enAttente? mergeTeams(c.team, enAttente) : c.team;
      return 'ok';
    }
    shell(backHome()+`<div style="margin-top:14px">${errorCard(e.message,'render()')}
      <p class="muted center">Votre équipe est enregistrée sur ce téléphone : réessayez dès que le réseau revient.</p></div>`);
    return 'offline';
  }
  if(t && t.deleted){
    clearMe(); unqueue(key);
    S.joinNotice='Votre équipe a été supprimée par l\u2019organisateur. Vous pouvez vous réinscrire.';
    return 'gone';
  }
  if(!cfg){
    clearMe(); unqueue(key);
    S.joinNotice='La course de votre équipe n\u2019existe plus. Choisissez une course ci-dessous.';
    return 'gone';
  }
  if(!t && enAttente) t=enAttente;   // fiche créée hors ligne, pas encore envoyée
  else if(t && enAttente) t=mergeTeams(enAttente,t);
  if(!t){ clearMe(); return 'gone'; }
  /* Lien vers une autre course alors que la précédente est terminée : nouvelle inscription */
  if(S.deepRace && S.deepRace!==me.raceId && t.end!=null){ clearMe(); return 'gone'; }
  S.raceId=me.raceId; S.config=ensureConfigShape(cfg); S.team=t;
  cacheRunner();
  return 'ok';
}
async function renderJoin(){
  shell(backHome()+`<div style="margin-top:14px">${loadingCard('Connexion à la course…')}</div>`);
  const me=getMe();
  if(me && me.raceId && me.teamId){
    const r=await resumeSession(me);
    if(r==='ok'){ preloadImages(); go('race'); return; }
    if(r==='offline') return;
  }
  let races;
  try{ races=await loadRacesStrict(); }
  catch(e){ shell(backHome()+`<div style="margin-top:14px">${errorCard(e.message,'render()')}</div>`); return; }
  const actives=races.filter(r=>!r.archived);
  if(!actives.length){
    shell(backHome()+`<div class="card" style="margin-top:14px"><h2>Aucune course ouverte</h2>

  }
  let cible=null;

  if(pasPrete){
    shell(backHome()+`<div class="card" style="margin-top:14px"><h2>Course en préparation</h2>
      <p class="muted">« ${esc(cfg.title)} » n'est pas encore prête. Réessayez dans un moment.</p>
      <button onclick="render()">Réessayer</button></div>`);

  }

    ${storageWorks()? '' : '<div class="banner warn">Ce navigateur bloque l\u2019enregistrement (navigation privée ?). Si vous fermez cette page, votre équipe sera perdue : ouvrez de préférence le lien dans une fenêtre normale.</div>'}
    ${inAppBrowser()? '<div class="banner warn">Cette page semble ouverte dans une fenêtre intégrée à une autre application. Ouvrez plutôt le lien dans Safari ou Chrome : la localisation et la caméra y fonctionnent mieux.</div>':''}
    <label for="teamName">Nom de votre équipe</label>
    <input id="teamName" maxlength="30" placeholder="ex. Les Renards" autocomplete="off" onkeydown="onEnter(event,createTeam)">
    ${libre? '' : `

    <p class="muted small-txt">L'attribution automatique répartit les équipes sur les ${parcours.length} parcours pour éviter qu'elles se suivent.</p>`}

function pickRace(id){ S.raceId=id; S.forceChoice=false; renderJoin(); }
function chooseOtherRace(){ S.raceId=null; S.deepRace=null; S.forceChoice=true; renderJoin(); }
async function createTeam(){
  if(S.joining) return;                       // second appui ignoré : une seule équipe est créée
  const nameEl=el('teamName'), msg=el('joinMsg'), btn=el('joinBtn');
  if(!nameEl || !msg) return;
  const name=String(nameEl.value||'').trim().replace(/\s+/g,' ').slice(0,30);
  if(!name){ msg.innerHTML='<div class="banner err">Donnez un nom à votre équipe.</div>'; return; }
  S.joining=true;
  if(btn){ btn.disabled=true; btn.textContent='Inscription…'; }
  const echec=html=>{
    S.joining=false;
    if(btn){ btn.disabled=false; btn.textContent='C\u2019est parti'; }
    msg.innerHTML='<div class="banner err">'+html+'</div>';
  };
  try{
    /* Équipes déjà inscrites : contrôle du nom et répartition sur les parcours */
    let equipes=[];
    try{ equipes=(await stAllStrict('co:team:'+S.raceId+':')).map(r=>r.v).filter(t=>t && t.id && !t.deleted); }
    catch(e){ echec('Base injoignable ('+esc(e.message)+'). Vérifiez la connexion et réessayez.'); return; }
    const n=normalize(name);
    /* Un nom n'est libre que si aucune équipe active ne le porte (une équipe
       qui a quitté la course libère le sien). */
    if(equipes.some(t=>!t.left && normalize(t.name)===n)){
      echec('Le nom « '+esc(name)+' » est déjà pris dans cette course. Choisissez-en un autre.');
      return;
    }
    let cid=null;
    if(!isFree()){
      const avecEtapes=S.config.courses.filter(c=>c.steps.length);
      const choix=(el('teamCourse')||{}).value||'auto';
      if(choix!=='auto' && avecEtapes.some(c=>c.id===choix)) cid=choix;
      else{
        /* Parcours le moins chargé ; à égalité, tirage au sort : des équipes qui
           s'inscrivent au même instant ne choisissent pas toutes le même. */
        const compte={}; avecEtapes.forEach(c=>compte[c.id]=0);
        equipes.forEach(t=>{ if(compte[t.courseId]!=null) compte[t.courseId]++; });
        const min=Math.min(...avecEtapes.map(c=>compte[c.id]));
        const ex=avecEtapes.filter(c=>compte[c.id]===min);
        cid=ex[Math.floor(Math.random()*ex.length)].id;
      }
    }
    const now=Date.now();
    S.team={id:uid(), name, courseId:cid, created:now, epoch:0, start:null, end:null, endMethod:null,
            scans:[], finalOk:false, statut:null, left:null, ts:{}};
    S.gpsTested=false; S.phase=null;
    await saveTeam();                          // mise en file d'attente si le réseau tombe à cet instant
    S.joinNotice=''; S.joining=false;
    preloadImages();
    go('race');
  }catch(e){ echec('Inscription impossible : '+esc(e.message)); }
}
/* Images du parcours, chargées tant qu'il y a du réseau (utile hors ligne) */
async function preloadImages(){
  const cfg=S.config; if(!cfg) return;
  const ids=new Set();
  if(isFree()) (cfg.posts||[]).forEach(p=>{ if(p.imgId) ids.add(p.imgId); });

/* =====================================================================
   LOCALISATION
   ===================================================================== */
/* Acquisition par observation continue : on garde le relevé le plus précis
   et on s'arrête dès que la condition est remplie (par défaut ±15 m ; pour
   une validation : dès qu'un relevé tombe dans le rayon du poste). */
function getPos(timeout, onProgress, stopWhen){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ S.geoErr='nosupport'; resolve(null); return; }
    let best=null, watchId=null, fini=false;
    const t0=Date.now();
    const finir=()=>{
      if(fini) return; fini=true;
      if(watchId!=null){ try{ navigator.geolocation.clearWatch(watchId); }catch(e){} }
      clearTimeout(to); if(iv) clearInterval(iv);
      resolve(best);
    };
    const to=setTimeout(finir, timeout);
    const iv=onProgress? setInterval(()=>{ try{ onProgress(Math.round((Date.now()-t0)/1000), best); }catch(e){} },500) : null;
    try{
      watchId=navigator.geolocation.watchPosition(
        p=>{
          S.geoErr=null;
          const c={lat:+p.coords.latitude.toFixed(6), lon:+p.coords.longitude.toFixed(6), acc:Math.max(1,Math.round(p.coords.accuracy||999))};
          S.lastPos=c; S.lastPosT=Date.now();   // mémorisée pour horodater les scans sans attente
          if(stopWhen && stopWhen(c)){ best=c; finir(); return; }
          if(!best || c.acc<=best.acc) best=c;
          if(!stopWhen && best.acc<=15) finir();
        },
        err=>{
          S.geoErr=err&&err.code;
          if(err && err.code===1) finir();      // permission refusée : attendre ne sert à rien
        },
        {enableHighAccuracy:true, maximumAge:0, timeout}
      );
    }catch(e){ S.geoErr='exception'; finir(); }
  });
}
/* Position pour simple horodatage d'un scan : la dernière connue si elle a
   moins de 2 minutes, sinon une courte recherche. La validation n'attend
   jamais longtemps : l'heure de passage est déjà figée. */
async function getPosForTag(){
  if(S.lastPos && (Date.now()-(S.lastPosT||0))<120000) return S.lastPos;
  return await getPos(4000);
}
function geoErrorMsg(){
  if(S.geoErr===1) return 'Localisation refusée. Ouvrez les réglages du navigateur et autorisez la position pour ce site, puis réessayez.'
    + (inAppBrowser()? ' Vous semblez être dans une fenêtre intégrée : ouvrez plutôt le lien dans Safari ou Chrome.':'');
  if(S.geoErr===2) return 'Le téléphone ne parvient pas à obtenir de position. Vérifiez que la localisation est activée dans les réglages de l\u2019appareil, puis réessayez.';
  if(S.geoErr===3) return 'Recherche trop longue. Restez à découvert, immobile quelques secondes, et réessayez.';
  if(S.geoErr==='nosupport') return 'Ce navigateur ne gère pas la localisation. Ouvrez le lien dans Safari ou Chrome.';
  return 'Position introuvable. Vérifiez que la localisation est autorisée, tenez le téléphone à découvert et réessayez.';
}
/* Navigateurs intégrés (réseaux sociaux, scanners de QR) où la position échoue souvent */
function inAppBrowser(){
  const ua=navigator.userAgent||'';
  return /FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|Snapchat|TikTok|MicroMessenger|GSA/i.test(ua);
}
async function geoPermState(){
  try{
    if(navigator.permissions && navigator.permissions.query){
      const r=await navigator.permissions.query({name:'geolocation'});
      return r.state;
    }
  }catch(e){}
  return 'inconnu';
}
function howToEnable(){
  const ua=navigator.userAgent||'';
  if(/iPad|iPhone|iPod/.test(ua))
    return 'Sur iPhone : Réglages &rsaquo; Confidentialité et sécurité &rsaquo; Service de localisation (activé), puis Réglages &rsaquo; Safari &rsaquo; Position &rsaquo; Demander. Rechargez ensuite cette page.';
  if(/Android/.test(ua))
    return 'Sur Android : touchez le cadenas à gauche de l\u2019adresse &rsaquo; Autorisations &rsaquo; Position &rsaquo; Autoriser. Vérifiez aussi que la localisation du téléphone est activée.';
  return 'Ouvrez les réglages de votre navigateur, autorisez la position pour ce site, puis rechargez la page.';
}
function nearestIn(posts,pos){
  let best=null, bd=Infinity;
  posts.forEach(p=>{
    if(!hasGpsCoords(p)) return;
    const d=haversine(pos.lat,pos.lon,Number(p.lat),Number(p.lon));
    if(d<=clampNum(p.radius,5,500,30) && d<bd){ bd=d; best=p; }
  });
  return best;
}
function progressHtml(sec,best){ return '<p class="muted">Recherche… '+sec+' s'+(best? ' · précision ±'+best.acc+' m':'')+'</p>'; }

/* =====================================================================
   BOUSSOLE
   ===================================================================== */
function watchCompass(){
  if(S.compassHooked) return;
  /* iOS 13+ exige une autorisation explicite, demandée depuis un geste
     de l'utilisateur. Sans elle, la boussole reste figée sur iPhone. */
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    if(!S.compassAsked) return;
  }
  window.addEventListener('deviceorientationabsolute',onHeading,true);
  window.addEventListener('deviceorientation',onHeading,true);
  S.compassHooked=true;
}
async function askCompass(){
  S.compassAsked=true;
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      await DeviceOrientationEvent.requestPermission();
    }
  }catch(e){ /* refus : la boussole restera fixe, nord en haut */ }
  watchCompass();
}
function onHeading(e){
  let h=null;
  if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;          // iOS
  else if(e.absolute && e.alpha!=null) h=360-e.alpha;                  // Android / standard
  if(h==null || isNaN(h)) return;
  const rose=el('rose'), n=el('needle');
  if(!rose && !n) return;
  /* La rose tourne à l'inverse du cap : le N pointe vers le nord réel.
     L'aiguille pointe vers l'azimut demandé, exprimé dans le même repère. */
  if(rose) rose.style.transform='rotate('+((-h%360)+360)%360+'deg)';
  if(n){
    const az=Number(n.dataset.az);
    if(!isNaN(az)) n.style.transform='rotate('+((az-h)%360+360)%360+'deg)';
  }
  const note=el('compassNote');
  if(note) note.textContent = n
    ? 'Boussole en direct : la flèche pointe vers le poste'
    : 'Boussole en direct : le N indique le nord réel';
}

/* =====================================================================
   SCAN DES QR CODES
   ===================================================================== */
function renderScan(){
  if(!S.team){ go('join'); return; }
  shell(`
  <button class="ghost small" onclick="go('race')">&larr; Retour</button>
  <div class="card stack" style="margin-top:14px">
    <h2>Scanner le QR du poste</h2>
    <video id="video" playsinline muted></video>
    <div id="scanMsg"><p class="muted">Autorisez la caméra, puis visez le QR code.</p></div>
  </div>`);
  startScan();
}
async function startScan(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('caméra non disponible'),{name:'NotSupported'});
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    if(S.view!=='scan'){ stream.getTracks().forEach(t=>t.stop()); return; }   // l'écran a changé entre-temps
    S.scanStream=stream;
    const video=el('video'); video.srcObject=stream; await video.play();
    const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d',{willReadFrequently:true});
    let averti=false;
    const tick=()=>{
      if(!S.scanStream) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth; canvas.height=video.videoHeight;
        ctx.drawImage(video,0,0);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
        if(code && code.data){
          if(code.data.startsWith('CO:')){ handleScan(code.data.slice(3)); return; }
          if(!averti){ averti=true; const m=el('scanMsg'); if(m) m.innerHTML='<div class="banner warn">Ce QR code n\u2019est pas un poste de la course.</div>'; }
        }
      }
      S.scanRAF=requestAnimationFrame(tick);
    };
    tick();
  }catch(err){
    const m=el('scanMsg');
    if(m) m.innerHTML=`<div class="banner err">Caméra inaccessible (${esc(err.name||err.message)}).</div>
      <p class="muted">Revenez à l'écran précédent et saisissez à la main le code à 6 caractères imprimé sous le QR.</p>`;
  }
}
function stopScan(){
  if(S.scanRAF){ cancelAnimationFrame(S.scanRAF); S.scanRAF=null; }
  if(S.scanStream){ S.scanStream.getTracks().forEach(t=>t.stop()); S.scanStream=null; }
}
async function handleScan(tok){
  stopScan();
  const res=await validateToken(tok);
  if(res.ok){ S.view='race'; renderRace(); return; }
  const m=el('scanMsg');
  if(m && !res.cancelled) m.innerHTML=`<div class="banner err">${res.msg}</div><button onclick="renderScan()">Scanner à nouveau</button>`;
  else if(res.cancelled){ S.view='race'; renderRace(); }
}

/* =====================================================================
   RÈGLES DE VALIDATION
   Un verrou empêche deux validations simultanées (double appui), et le
   passage est inscrit dans la fiche AVANT toute attente : un second appui
   trouve le poste déjà validé au lieu de le compter deux fois.
   ===================================================================== */
async function withBusy(fn){
  if(S.busy) return {ok:false, msg:'Validation déjà en cours…'};
  S.busy=true;
  try{ return await fn(); }
  finally{ S.busy=false; }
}
function succes(msg){
  S.flash=msg;
  try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){}
}
/* Course traditionnelle : seul le prochain poste du parcours est accepté */
async function commonValidate(post, method, pos){
  const t=S.team, c=teamCourse();
  if(!c) return {ok:false,msg:'Parcours introuvable : prévenez l\u2019organisateur.'};
  if(!t.start) return {ok:false,msg:'Démarrez d\u2019abord le chrono.'};
  const k=progressIndex(t,c);
  if(t.end!=null || k>=c.steps.length) return {ok:false,msg:'Votre parcours est déjà terminé.'};
  if(validatedIds(t).has(post.id)) return {ok:false,msg:'Poste « '+esc(post.name)+' » déjà validé.'};
  if(post.id!==c.steps[k].postId) return {ok:false,msg:'« '+esc(post.name)+' » n\u2019est pas votre prochain poste. Suivez l\u2019ordre de votre parcours !'};
  const now=Date.now();
  const scan={postId:post.id, t:now, method};
  t.scans.push(scan);
  if(isCourseComplete(t,c)){ t.end=now; t.endMethod='parcours'; touch(t,'end',now); }
  const p=pos || await getPosForTag();
  if(p){ scan.lat=p.lat; scan.lon=p.lon; scan.acc=p.acc; }
  await saveTeam();
  succes('Poste « '+post.name+' » validé !');
  return {ok:true, post};
}
/* Ordre libre / points : n'importe quel poste non validé, avant l'heure limite */
async function freeValidate(post, method, pos){
  const t=S.team, cfg=S.config;
  if(!t.start) return {ok:false,msg:'Démarrez d\u2019abord le chrono.'};
  if(t.end!=null) return {ok:false,msg:'Votre course est terminée.'};
  if(post.id===arrivalId(cfg)) return validateArrival(method,pos);
  if(validatedIds(t).has(post.id)) return {ok:false,msg:'Poste « '+esc(post.name)+' » déjà validé.'};
  const dl=deadlineOf(t,cfg);
  if(dl!=null && Date.now()>=dl) return {ok:false,msg:'Temps écoulé : plus aucun poste ne peut être validé. Rejoignez l\u2019arrivée.'};
  const scan={postId:post.id, t:Date.now(), method};
  t.scans.push(scan);
  const p=pos || await getPosForTag();
  if(p){ scan.lat=p.lat; scan.lon=p.lon; scan.acc=p.acc; }
  await saveTeam();
  succes('Poste « '+post.name+' » validé !'+(isPoints()? ' +'+postPoints(post)+' pts' : ''));
  return {ok:true, post};
}
/* Arrivée : arrête le chrono (le malus éventuel est calculé à cet instant) */
async function validateArrival(method,pos){
  const t=S.team, cfg=S.config, a=arrivalId(cfg);
  if(!a) return {ok:false,msg:'Aucun poste d\u2019arrivée dans cette course.'};
  if(!t.start) return {ok:false,msg:'Démarrez d\u2019abord le chrono.'};
  if(t.end!=null) return {ok:false,msg:'Votre arrivée est déjà validée.'};
  const dl=deadlineOf(t,cfg);
  if(dl!=null && Date.now()<dl && !confirm('Valider votre arrivée termine la course : vous ne pourrez plus valider de poste. Continuer ?'))
    return {ok:false, msg:'', cancelled:true};
  const now=Date.now();
  let scan=scanOf(t,a);
  if(!scan){ scan={postId:a, t:now, method}; t.scans.push(scan); }
  t.end=now; t.endMethod='arrivee'; touch(t,'end',now);
  const p=pos || await getPosForTag();
  if(p && scan.lat==null){ scan.lat=p.lat; scan.lon=p.lon; scan.acc=p.acc; }
  await saveTeam();
  succes('Arrivée validée !');
  return {ok:true, arrival:true};
}
/* QR scanné ou code du QR saisi à la main */
async function validateToken(tok){
  tok=String(tok||'').trim().toUpperCase().replace(/\s+/g,'');
  let post=S.config.posts.find(p=>p.token===tok);
  if(!post){ await refreshConfig(); post=S.config.posts.find(p=>p.token===tok); }
  if(!post) return {ok:false,msg:'QR code inconnu — ce n\u2019est pas un poste de cette course.'};
  if(!postMethods(post).includes('qr')) return {ok:false,msg:'Ce poste ne se valide pas par QR code.'};
  return withBusy(()=> isFree()? freeValidate(post,'qr') : commonValidate(post,'qr'));
}

async function restartTeam(){
  if(!confirm('Recommencer depuis le début ? Votre temps et vos validations seront effacés.')) return;
  const t=S.team, now=Date.now();
  t.epoch=(t.epoch||0)+1;
  t.start=null; t.end=null; t.endMethod=null; t.scans=[]; t.finalOk=false;
  touch(t,'end',now); touch(t,'finalOk',now);
  S.gpsTested=false; S.phase=null;
  await saveTeam(); renderRace();

async function leaveTeam(){
  if(!confirm('Quitter la course ? Vous pourrez vous réinscrire sous un autre nom.')) return;
  const t=S.team, key=teamKey(S.raceId,t.id);
  const vide=!t.start && !(t.scans||[]).length;
  if(!vide){ t.statut='hc'; t.left=Date.now(); touch(t,'statut'); }
  try{
    if(vide) await tombstoneTeam(key,t.id);   // inscription jamais partie : on l'efface
    else await writeTeam(key,t);              // abandon : visible « hors classement » chez l'organisateur
    unqueue(key);
  }catch(e){
    if(!vide) queueWrite(key,'team',t);       // hors ligne : l'abandon partira plus tard
  }
  clearMe();
  S.team=null; S.joinNotice=''; S.gpsTested=false;
  go('join');
}

async function startRace(){

function renderClassicRace(){
  const t=S.team, c=teamCourse();

  const dernierP=dernier? postById(dernier.postId) : null;

    body.innerHTML=`${flashHtml()}

    <div class="card center stack">
      <h2>${t.start? fmtT(t.end-t.start) : '—'}</h2>
      <p class="muted">${done} poste${done>1?'s':''} validé${done>1?'s':''} sur ${total}</p>
      <hr class="divider">
      ${c.steps.map((s,i)=>{ const sc=scanOf(t,s.postId); return `<p style="font-size:14px"><span class="mono muted">${String(i+1).padStart(2,'0')}</span> ${esc(postName(s.postId))} — <span class="mono">${sc? fmtClock(sc.t) : 'non validé'}</span></p>`; }).join('')}
    </div>
    ${historyBlock(c)}
    ${teamOptions()}`;
    return;
  }
  if(!t.start){
    body.innerHTML=`
    <div class="card stack">
      <h3>Avant de partir</h3>
      <p class="muted">Votre parcours compte ${total} postes, à trouver dans l'ordre. Le premier vous sera indiqué dès que vous lancerez le chrono.</p>
    </div>
    ${startBlock()}
    ${teamOptions()}`;
    return;
  }
  const step=c.steps[k], post=postById(step.postId);
  const m=postMethods(post);
  const canQR=m.includes('qr');
  const canGPS=m.includes('gps') && hasGpsCoords(post);
  const canCode=m.includes('code') && post && String(post.answer||'').trim()!=='';
  body.innerHTML=`${flashHtml()}
    ${dernierP&&dernierP.story? storyBox(dernierP):''}
    <div class="card stack">

        <div class="row">

          <button class="fix primary" onclick="checkCode()">Valider</button>
        </div><div id="codeMsg"></div>`:''}
      ${canQR? `<button class="${canCode?'':'primary'}" onclick="go('scan')">Scanner le poste</button>`:''}
      ${canGPS? `<button class="${(canCode||canQR)?'':'primary'}" onclick="checkGPS()">Vérifier ma position</button><div id="gpsMsg"></div>`:''}
      ${(!canQR&&!canGPS&&!canCode)? '<div class="banner err">Ce poste n\u2019a aucun moyen de validation configuré. Prévenez l\u2019organisateur : il peut le valider pour vous.</div>':''}
      ${canQR? `<details><summary class="muted" style="cursor:pointer">Caméra indisponible ? Saisie manuelle</summary>
        <div class="row" style="margin-top:8px">
          <input id="manualCode" placeholder="Code à 6 caractères" maxlength="6" style="text-transform:uppercase" autocomplete="off" onkeydown="onEnter(event,manualScan)">
          <button class="fix" onclick="manualScan()">Valider</button>
        </div><div id="manualMsg"></div>

}
async function manualScan(){
  const inp=el('manualCode'), box=el('manualMsg'); if(!inp||!box) return;
  const tok=String(inp.value||'').trim().toUpperCase();
  if(tok.length!==6){ box.innerHTML='<div class="banner err" style="margin-top:8px">Le code fait 6 caractères.</div>'; return; }
  const res=await validateToken(tok);
  if(res.ok){ renderRace(); return; }
  if(!res.cancelled){ const b=el('manualMsg'); if(b) b.innerHTML='<div class="banner err" style="margin-top:8px">'+res.msg+'</div>'; }
}
async function checkCode(){
  const box=el('codeMsg'), input=el('postCode');
  if(!box||!input) return;
  if(!normalize(input.value)){ box.innerHTML='<div class="banner err">Saisissez une réponse.</div>'; return; }
  const c=teamCourse(); if(!c) return;
  const k=progressIndex(S.team,c);
  if(k>=c.steps.length){ renderRace(); return; }
  let post=postById(c.steps[k].postId);
  let ok=post && answerMatches(post.answer, input.value);
  if(!ok){ await refreshConfig(); post=postById(c.steps[k].postId); ok=post && answerMatches(post.answer, input.value); }
  if(!ok){ const b=el('codeMsg'); if(b) b.innerHTML='<div class="banner err">Ce n\u2019est pas la bonne réponse. Regardez mieux autour de vous !</div>'; return; }
  const res=await withBusy(()=>commonValidate(post,'code'));
  if(res.ok){ renderRace(); return; }
  const b=el('codeMsg'); if(b) b.innerHTML='<div class="banner err">'+res.msg+'</div>';
}
async function checkGPS(){
  const m=el('gpsMsg'); if(!m || S.gpsRunning) return;
  const c=teamCourse(); if(!c) return;
  const k=progressIndex(S.team,c);
  if(k>=c.steps.length){ renderRace(); return; }
  const cible=()=>postById(c.steps[k].postId);
  if(!hasGpsCoords(cible())){ m.innerHTML='<div class="banner err">Ce poste ne se valide pas par GPS.</div>'; return; }
  const dedans=pos=>{ const p=cible(); return p && hasGpsCoords(p) && haversine(pos.lat,pos.lon,Number(p.lat),Number(p.lon))<=clampNum(p.radius,5,500,30); };
  m.innerHTML='<p class="muted">Recherche de votre position…</p>';
  S.gpsRunning=true;
  const pos=await getPos(25000,(sec,best)=>{ const e=el('gpsMsg'); if(e) e.innerHTML=progressHtml(sec,best); }, dedans);
  S.gpsRunning=false;
  const box=el('gpsMsg'); if(!box) return;
  if(!pos){ box.innerHTML='<div class="banner err">'+esc(geoErrorMsg())+'</div><button class="small" onclick="checkGPS()">Réessayer</button>'; return; }
  let ok=dedans(pos);
  if(!ok && await refreshConfig()) ok=dedans(pos);
  if(ok){
    const res=await withBusy(()=>commonValidate(cible(),'gps',pos));
    if(res.ok){ renderRace(); return; }
    box.innerHTML='<div class="banner err">'+res.msg+'</div>'; return;
  }
  /* Réponse volontairement binaire : pas de distance affichée, pour préserver le travail de carte */
  box.innerHTML = pos.acc>35
    ? '<div class="banner err">Signal GPS imprécis (±'+pos.acc+' m). Placez-vous en zone plus dégagée, patientez quelques secondes et réessayez.</div>'
    : '<div class="banner err">Vous n\u2019êtes pas dans la zone du poste. Vérifiez votre carte et votre azimut !</div>';
}

/* Carte de l'arrivée ; « controles » : afficher la saisie de code et le scan

    ${clueImgHtml(arr.imgId,'Plan de l\u2019arrivée')}
    ${gps? `<button class="accent" onclick="arrivalGPS()">Valider mon arrivée</button><div id="arrMsg"></div>`:''}
    ${m.includes('qr')? (controles? `<button class="${gps?'':'accent'}" onclick="go('scan')">Scanner le QR de l'arrivée</button>` : '<p class="muted small-txt">Vous pouvez aussi scanner le QR code de l\u2019arrivée.</p>'):''}
    ${m.includes('code')? (controles? `<div class="row"><input id="arrCode" placeholder="Code de l'arrivée" autocomplete="off" onkeydown="onEnter(event,()=>freeCheckCode('arrCode','arrCodeMsg'))">
      <button class="fix" onclick="freeCheckCode('arrCode','arrCodeMsg')">Valider</button></div><div id="arrCodeMsg"></div>` : '<p class="muted small-txt">Vous pouvez aussi saisir le code de l\u2019arrivée dans le champ « Code » ci-dessus.</p>'):''}
    ${!m.length? '<p class="muted">L\u2019organisateur validera votre arrivée.</p>':''}
    <details><summary class="muted small-txt" style="cursor:pointer">L'arrivée ne se valide pas ?</summary>
      <p class="muted small-txt" style="margin-top:6px">Prévenez l'organisateur : il peut valider votre arrivée depuis son suivi. En dernier recours seulement :</p>
      <button class="small ghost" onclick="finishFree()">Terminer manuellement</button>
    </details>
  </div>`;
}
function renderFreeRace(){
  const cfg=S.config, t=S.team, pts=isPoints();
  const posts=collectPosts(cfg), v=validatedIds(t);
  const done=posts.filter(p=>v.has(p.id)).length, total=posts.length;
  const phase=freePhase(); S.phase=phase;
  const s=scoreOf(t,cfg);
  const reste=t.start? deadlineOf(t,cfg)-Date.now() : limitMs(cfg);
  const chrono= phase==='fini'? fmtT(t.end-t.start) : (t.start? fmtSigned(reste) : fmtT(limitMs(cfg)));
  const libelle= phase==='fini'? 'temps final' : (phase==='avant'? 'durée prévue' : (phase==='depasse'? 'retard' : 'temps restant'));
  shell(raceHeader(done+'/'+total+' postes'+(pts? ' · <b id="scoreLive">'+s.total+'</b> pts':''), chrono, libelle, phase==='depasse'||phase==='fin-proche')
    +`<div class="progressbar">${posts.map(p=>`<i class="${v.has(p.id)?'done':''}"></i>`).join('')}</div>
    <div class="syncwarn"></div><div id="raceBody"></div>`);
  const body=el('raceBody');
  if(phase==='fini'){ body.innerHTML=flashHtml()+freeFinishScreen(); return; }
  if(phase==='avant'){
    const arr=arrivalPost();
    body.innerHTML=`
    <div class="card stack">
      <h3>Avant de partir</h3>
      <p>Vous avez <b>${clampNum(cfg.limitMin,1,1440,90)} minutes</b> pour valider un maximum de postes, dans l'ordre que vous voulez.</p>
      ${pts? `<p class="muted">Chaque poste rapporte des points, indiqués dans la liste. Au-delà du temps limite, plus aucun poste ne compte et chaque minute de retard entamée coûte ${penaltyRate()} point${penaltyRate()>1?'s':''}.</p>`
           : '<p class="muted">Au-delà du temps limite, plus aucun poste ne peut être validé.</p>'}
      <p class="muted">${arr? 'Pour arrêter votre chrono, validez l\u2019arrivée (« '+esc(arr.name)+' »).' : 'De retour, arrêtez votre chrono avec le bouton « Terminer la course ».'}</p>
      ${String(cfg.finalAnswer||'').trim()? '<p class="muted">Certains postes livrent un fragment : rassemblez-les pour résoudre l\u2019énigme finale.</p>':''}
    </div>
    ${startBlock()}
    ${teamOptions()}`;
    return;
  }
  const liste=`<div class="card"><h3>Postes ${done}/${total}</h3>${posts.map(p=>freePostLine(p,pts)).join('')||'<p class="muted">Aucun poste configuré.</p>'}</div>`;
  if(phase==='depasse'){
    body.innerHTML=`${flashHtml()}
    <div class="banner err">Temps écoulé ! Plus aucun poste ne peut être validé.<p>Rejoignez l'arrivée${arrivalPost()?' et validez-la':''}${pts? ' : chaque minute de retard entamée coûte '+penaltyRate()+' point'+(penaltyRate()>1?'s':'')+'.' : '.'}</p></div>
    ${arrivalCard(true)}
    ${liste}
    ${teamOptions()}`;
    return;
  }
  const restants=posts.filter(p=>!v.has(p.id));
  const arr=arrivalPost(), am=postMethods(arr);
  const avecQR=restants.some(p=>postMethods(p).includes('qr')) || am.includes('qr');
  const avecGPS=restants.some(p=>postMethods(p).includes('gps') && hasGpsCoords(p));
  body.innerHTML=`${flashHtml()}
    ${phase==='fin-proche'? '<div class="banner warn">Moins de 5 minutes : pensez à rejoindre l\u2019arrivée !</div>':''}
    <div class="card stack">
      <h3>Valider un poste</h3>
      <div class="row">
        <input id="freeCode" placeholder="Code, réponse, ou code du QR" autocomplete="off" onkeydown="onEnter(event,()=>freeCheckCode())">
        <button class="fix primary" onclick="freeCheckCode()">Valider</button>
      </div>
      <div id="freeMsg"></div>
      ${(avecQR||avecGPS)? `<div class="row wrap">
        ${avecQR? '<button onclick="go(\'scan\')">Scanner un QR</button>':''}
        ${avecGPS? '<button onclick="freeCheckGPS()">Vérifier ma position</button>':''}
      </div>`:''}
      <div id="gpsMsg"></div>
    </div>
    ${arrivalCard(false)}
    ${liste}
    ${teamOptions()}`;
}
/* Recherche du poste correspondant à une saisie : code d'un QR (caméra en
   panne) ou réponse d'un poste « code », de préférence pas encore validé */
function findFreeCodePost(brut, cfg){
  const tok=String(brut||'').toUpperCase().replace(/\s+/g,'');
  const parToken=(cfg.posts||[]).find(p=>p.token===tok && postMethods(p).includes('qr'));
  if(parToken) return {post:parToken, method:'qr'};
  const v=validatedIds(S.team);
  const cands=(cfg.posts||[]).filter(p=>postMethods(p).includes('code') && answerMatches(p.answer,brut));
  const p=cands.find(x=>!v.has(x.id)) || cands[0];
  return p? {post:p, method:'code'} : null;
}
async function freeCheckCode(inputId, msgId){
  inputId=inputId||'freeCode'; msgId=msgId||'freeMsg';
  const inp=el(inputId), box=el(msgId); if(!inp||!box) return;
  const brut=String(inp.value||'').trim();
  if(!brut){ box.innerHTML='<div class="banner err">Saisissez un code ou une réponse.</div>'; return; }
  let f=findFreeCodePost(brut, S.config);
  if(!f){ await refreshConfig(); f=findFreeCodePost(brut, S.config); }
  if(!f){ const b=el(msgId); if(b) b.innerHTML='<div class="banner err">Aucun poste ne correspond à ce code.</div>'; return; }
  const res=await withBusy(()=>freeValidate(f.post, f.method));
  if(res.ok){ renderRace(); return; }
  if(!res.cancelled){ const b=el(msgId); if(b) b.innerHTML='<div class="banner err">'+res.msg+'</div>'; }
}
/* Position comparée à tous les postes GPS non validés (hors arrivée) : le plus proche l'emporte */
async function freeCheckGPS(){
  const box=el('gpsMsg'); if(!box || S.gpsRunning) return;
  if(freePhase()!=='course' && freePhase()!=='fin-proche'){ renderRace(); return; }
  const cands=()=>collectPosts(S.config).filter(p=>postMethods(p).includes('gps') && hasGpsCoords(p) && !validatedIds(S.team).has(p.id));
  if(!cands().length){ box.innerHTML='<div class="banner info">Aucun poste GPS à valider.</div>'; return; }
  box.innerHTML='<p class="muted">Recherche de votre position…</p>';
  S.gpsRunning=true;
  const pos=await getPos(25000,(sec,best)=>{ const e=el('gpsMsg'); if(e) e.innerHTML=progressHtml(sec,best); }, p=>!!nearestIn(cands(),p));
  S.gpsRunning=false;
  const b=el('gpsMsg'); if(!b) return;
  if(!pos){ b.innerHTML='<div class="banner err">'+esc(geoErrorMsg())+'</div><button class="small" onclick="freeCheckGPS()">Réessayer</button>'; return; }
  let cible=nearestIn(cands(),pos);
  if(!cible && await refreshConfig()) cible=nearestIn(cands(),pos);
  if(!cible){
    b.innerHTML = pos.acc>35
      ? '<div class="banner err">Signal GPS imprécis (±'+pos.acc+' m). Placez-vous à découvert et réessayez.</div>'
      : '<div class="banner err">Aucun poste à valider ici.</div>';
    return;
  }
  const res=await withBusy(()=>freeValidate(cible,'gps',pos));
  if(res.ok){ renderRace(); return; }
  const b2=el('gpsMsg'); if(b2 && !res.cancelled) b2.innerHTML='<div class="banner err">'+res.msg+'</div>';
}
/* Bouton dédié à l'arrivée : la vérification générale ne la valide jamais
   par accident en passant près du départ. */
async function arrivalGPS(){
  const box=el('arrMsg'); if(!box || S.gpsRunning) return;
  const dedans=pos=>{ const a=arrivalPost(); return a && hasGpsCoords(a) && haversine(pos.lat,pos.lon,Number(a.lat),Number(a.lon))<=clampNum(a.radius,5,500,30); };
  box.innerHTML='<p class="muted">Recherche de votre position…</p>';
  S.gpsRunning=true;
  const pos=await getPos(25000,(sec,best)=>{ const e=el('arrMsg'); if(e) e.innerHTML=progressHtml(sec,best); }, dedans);
  S.gpsRunning=false;
  const b=el('arrMsg'); if(!b) return;
  if(!pos){ b.innerHTML='<div class="banner err">'+esc(geoErrorMsg())+'</div><button class="small" onclick="arrivalGPS()">Réessayer</button>'; return; }
  let ok=dedans(pos);
  if(!ok && await refreshConfig()) ok=dedans(pos);
  if(!ok){
    b.innerHTML = pos.acc>35
      ? '<div class="banner err">Signal GPS imprécis (±'+pos.acc+' m). Placez-vous à découvert et réessayez.</div>'
      : '<div class="banner err">Vous n\u2019êtes pas encore dans la zone d\u2019arrivée.</div>';
    return;
  }
  const res=await withBusy(()=>validateArrival('gps',pos));
  if(res.ok){ renderRace(); return; }
  const b2=el('arrMsg'); if(b2 && !res.cancelled) b2.innerHTML='<div class="banner err">'+res.msg+'</div>';
}
async function finishFree(){
  const t=S.team; if(!t || t.end!=null || !t.start) return;
  const msg=arrivalPost()
    ? 'Terminer manuellement, sans valider l\u2019arrivée ? Le chrono s\u2019arrête maintenant. Prévenez l\u2019organisateur.'
    : 'Terminer la course maintenant ? Le chrono s\u2019arrête et vous ne pourrez plus valider de poste.';
  if(!confirm(msg)) return;
  const now=Date.now();
  t.end=now; t.endMethod='manuel'; touch(t,'end',now);
  await saveTeam(); renderRace();
}
/* Écran de fin : score détaillé, fragments, énigme finale */
function freeFinishScreen(){
  const t=S.team, cfg=S.config, pts=isPoints(), s=scoreOf(t,cfg);
  const nb=collectPosts(cfg).length;
  const frags=(t.scans||[]).slice().sort((a,b)=>(a.t||0)-(b.t||0))
    .map(x=>{ const p=postById(x.postId); return (p && p.id!==arrivalId() && p.fragment)? p.fragment : null; }).filter(Boolean);
  const enigme=String(cfg.finalAnswer||'').trim()!=='' && !t.finalOk;
  const titre={organisateur:'Course close par l\u2019organisateur.', manuel:'Course terminée.', arrivee:'Arrivée validée — bravo !'}[t.endMethod]||'Course terminée — bravo !';
  return `
  <div class="banner ok">${titre}</div>
  <div class="card center stack">
    ${pts? `<h2>${s.total} point${s.total>1?'s':''}</h2>
      <p class="muted">${s.postsPts} pts de postes${s.enigme? ' + '+s.enigme+' pts d\u2019énigme':''}${s.penalty? ' &minus; '+s.penalty+' de retard ('+s.lateMin+' min)':''}</p>`
         : `<h2>${s.collected} poste${s.collected>1?'s':''} sur ${nb}</h2>`}
    <p class="muted">Temps : ${t.start? fmtT(t.end-t.start) : '—'}${s.lateMin? ' · hors délai de '+s.lateMin+' min' : ''}</p>
  </div>
  ${frags.length? `<div class="card">
    <h3>Fragments collectés</h3>
    <p class="mono" style="font-size:22px;letter-spacing:3px;margin-top:6px">${frags.map(esc).join(' ')}</p>
  </div>`:''}
  ${enigme? `<div class="card stack">
    <h3>Énigme finale</h3>
    <p>${esc(cfg.finalQuestion||'Quelle est la réponse ?')}</p>
    <div class="row">
      <input id="finalAns" placeholder="Votre réponse" autocomplete="off" onkeydown="onEnter(event,checkFinal)">
      <button class="fix primary" onclick="checkFinal()">Valider</button>
    </div><div id="finalMsg"></div>
  </div>`:''}
  ${t.finalOk? `<div class="banner ok">Énigme finale résolue !${pts&&s.enigme? ' +'+s.enigme+' pts':''}</div>`:''}
  <div class="card">
    <h3>Vos passages</h3>
    ${(t.scans||[]).slice().sort((a,b)=>(a.t||0)-(b.t||0)).map((x,i)=>`<p style="font-size:14px"><span class="mono muted">${String(i+1).padStart(2,'0')}</span> ${esc(postName(x.postId))}${x.postId===arrivalId()?' (arrivée)':''} — <span class="mono">${fmtClock(x.t)}</span></p>`).join('')||'<p class="muted">Aucun poste validé.</p>'}
  </div>
  ${teamOptions()}`;
}
async function checkFinal(){
  const box=el('finalMsg'), inp=el('finalAns');
  if(!box||!inp) return;
  if(!normalize(inp.value)){ box.innerHTML='<div class="banner err">Saisissez une réponse.</div>'; return; }
  let ok=answerMatches(S.config.finalAnswer, inp.value);
  if(!ok && await refreshConfig()) ok=answerMatches(S.config.finalAnswer, inp.value);
  if(!ok){ const b=el('finalMsg'); if(b) b.innerHTML='<div class="banner err">Ce n\u2019est pas la bonne réponse.</div>'; return; }
  S.team.finalOk=true; touch(S.team,'finalOk');
  await saveTeam(); renderRace();
}

/* =====================================================================
   SYNCHRONISATION CONTINUE (téléphone de l'équipe)
   Toutes les 15 s : envoi des validations en attente, lecture de la fiche
   en base et fusion (crédit de l'organisateur, remise à zéro, suppression).
   ===================================================================== */
async function syncTeam(){
  if(!SHARED_MODE || !S.team || !S.raceId || S.syncing) return;
  if(S.view!=='race' && S.view!=='scan') return;
  S.syncing=true;
  try{
    await flushPending();
    if(!S.team) return;
    const key=teamKey(S.raceId,S.team.id);
    let remote;
    try{ remote=await stGetStrict(key); }catch(e){ return; }
    if(!S.team) return;
    if(remote && remote.deleted){ teamWasDeleted(); return; }
    if(!remote){ if(!pending[key]) saveTeam(); return; }   // fiche jamais arrivée : on la renvoie
    const avant=teamSig(S.team);
    const fusion=mergeTeams(S.team, remote);
    S.team=fusion;
    const clos=finalizeIfComplete();
    cacheRunner();
    if((clos || teamSig(S.team)!==teamSig(remote)) && !pending[key]) saveTeam();   // modifications locales pas encore en base
    S.syncCount=(S.syncCount||0)+1;
    if(S.syncCount%4===0) await refreshConfig();
    if(teamSig(S.team)!==avant) rerenderIfSafe();
  } finally { S.syncing=false; }
}
/* Ne redessine pas l'écran pendant une saisie, un scan, une recherche GPS
   ou la consultation d'une carte : on attend le bon moment. */
function rerenderIfSafe(){
  if(S.view!=='race'){ S.needRender=true; return; }
  const a=document.activeElement;
  const saisie=a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA') && String(a.value||'')!=='';
  if(saisie || LB.el || S.busy || S.gpsRunning){ S.needRender=true; return; }
  S.needRender=false;
  renderRace();
}
function tickChrono(){
  const t=S.team; if(!t || !S.config) return;
  if(S.needRender){ rerenderIfSafe(); if(!S.needRender) return; }
  const ch=el('chrono'); if(!ch) return;
  if(!t.start || t.end!=null) return;
  if(isFree()){
    const reste=deadlineOf(t,S.config)-Date.now();
    ch.textContent=fmtSigned(reste);
    ch.classList.toggle('late', reste<300000);
    const phase=freePhase();
    if(phase!==S.phase){ S.phase=phase; S.needRender=true; rerenderIfSafe(); return; }
    if(phase==='depasse' && isPoints()){ const sl=el('scoreLive'); if(sl) sl.textContent=scoreOf(t,S.config).total; }
  } else {
    ch.textContent=fmtT(Date.now()-t.start);
  }
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
(function demarrage(){
  lsLoadAll();
  loadPending();
  try{ const c=new URLSearchParams(location.search).get('course'); if(c) S.deepRace=c; }catch(e){}
  setInterval(flushPending, 10000);
  window.addEventListener('online', ()=>{ flushPending(); syncTeam(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ flushPending(); syncTeam(); } });
  /* Avertissement à la fermeture si des validations n'ont pas encore été envoyées */
  window.addEventListener('beforeunload', e=>{ if(SHARED_MODE && pendingCount()){ e.preventDefault(); e.returnValue=''; return ''; } });
  /* Reprise directe d'une course en cours (page rechargée, onglet rouvert) */
  const me=getMe();
  let reprendre=false;
  if(me && me.teamId){
    const c=readRunnerCache(me.raceId, me.teamId);
    reprendre = !c || c.team.end==null;
  }
  if(S.deepRace || reprendre) go('join'); else go('home');
  flushPending();
})();

</script>
