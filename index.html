<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balise — Course d'orientation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F0; --ink:#1E2420; --forest:#1D5C42; --forest-d:#123D2C;
  --flag:#E8590C; --flag-l:#FDEEE3; --line:#D8D2C4; --ok:#1D7A46; --err:#B3261E;
  --info:#1F5A8C; --info-l:#E4EEF7;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-weight:500;min-height:100vh}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:.5;z-index:0;
  background-image:repeating-radial-gradient(circle at 85% -10%, transparent 0 58px, var(--line) 58px 59px);}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px 60px}
/* Espace organisateur : plus large sur ordinateur */
#app.wide{max-width:1040px}
h1{font-weight:900;font-size:26px;letter-spacing:-.5px}
h2{font-weight:700;font-size:19px;margin-bottom:12px}
h3{font-weight:700;font-size:15px}
p{line-height:1.5}
.muted{color:#6B6A60;font-size:13px}
.small-txt{font-size:12px}
.mono{font-family:var(--mono)}
.flagmark{display:inline-block;width:22px;height:22px;border-radius:4px;vertical-align:-4px;
  background:linear-gradient(135deg,#fff 0 50%,var(--flag) 50% 100%);border:1.5px solid var(--ink)}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:3px 3px 0 var(--line)}
.card.dashed{border-style:dashed}
button{font-family:inherit;font-weight:700;font-size:15px;border-radius:10px;border:1.5px solid var(--ink);
  background:#fff;color:var(--ink);padding:12px 16px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:none}
button.primary{background:var(--forest);color:#fff}
button.accent{background:var(--flag);color:#fff}
button.danger{background:#fff;color:var(--err);border-color:var(--err);box-shadow:2px 2px 0 var(--err)}
button.small{padding:6px 10px;font-size:13px;box-shadow:1px 1px 0 var(--ink)}
button.ghost{border-color:var(--line);box-shadow:none;font-weight:500}
button.link{border:none;box-shadow:none;background:none;padding:0;font-weight:500;text-decoration:underline;font-size:13px;color:#6B6A60}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--ink);
  border-radius:10px;width:100%;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:60px}
label{font-size:13px;font-weight:700;display:block;margin:10px 0 4px}
label.inline{display:flex;align-items:center;gap:6px;margin:0;font-weight:500}
label.inline input{width:auto}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row .fix{flex:0 0 auto}
.row.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1.5px solid var(--ink);white-space:nowrap}
.tag.ok{background:#DDF2E4;color:var(--ok);border-color:var(--ok)}
.tag.warn{background:var(--flag-l);color:var(--flag);border-color:var(--flag)}
.tag.err{background:#FBE7E5;color:var(--err);border-color:var(--err)}
.tag.info{background:var(--info-l);color:var(--info);border-color:var(--info)}
.tag.mute{background:#F1EEE6;color:#6B6A60;border-color:var(--line)}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:12px;border:1.5px solid}
.banner.ok{background:#DDF2E4;border-color:var(--ok);color:var(--ok)}
.banner.err{background:#FBE7E5;border-color:var(--err);color:var(--err)}
.banner.info{background:var(--info-l);border-color:var(--info);color:var(--info)}
.banner.warn{background:var(--flag-l);border-color:var(--flag);color:var(--flag)}
.banner p{font-weight:500}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{box-shadow:none;border-color:var(--line);font-size:13px;padding:8px 12px;background:transparent}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subtabs{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap}
.subtabs button{box-shadow:none;border-color:var(--line);font-size:13px;padding:6px 10px;background:transparent;font-weight:500}
.subtabs button.on{background:var(--forest);color:#fff;border-color:var(--forest);font-weight:700}
.postline{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.postline .name{flex:1;font-weight:700;min-width:140px}
.seq{display:flex;align-items:flex-start;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:10px;margin-top:8px}
.seq.done{border-style:solid;border-color:var(--ok);background:#F6FBF7}
.seq.arrival{border-style:solid;border-color:var(--forest);background:#F3F8F5}
.seq .n,.n{font-family:var(--mono);font-size:13px;background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px}
.progressbar{display:flex;gap:5px;margin:10px 0}
.progressbar i{flex:1;height:8px;border-radius:4px;background:#E7E2D6;border:1px solid var(--line)}
.progressbar i.done{background:var(--flag);border-color:var(--flag)}
/* Éditeur de postes replié */
.pgroup-h{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-weight:700;font-size:14px}
.pgroup-h .line{flex:1;border-top:1.5px dashed var(--line)}
.pgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:860px){ #app.wide .pgrid{grid-template-columns:1fr 1fr} }
.pitem{border:1.5px solid var(--line);border-radius:10px;background:#fff}
.pitem.open{grid-column:1/-1;border-color:var(--ink)}
.phead{display:flex;align-items:center;gap:6px;padding:9px 10px;cursor:pointer;flex-wrap:wrap}
.phead .pname{font-weight:700;flex:1;min-width:120px}
.pbody{padding:0 12px 12px}
.badge{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:#4A4A42;background:#F7F4EC}
.badge.arr{background:var(--forest);color:#fff;border-color:var(--forest)}
.badge.warn{background:var(--flag-l);color:var(--flag);border-color:var(--flag)}
.compass{width:120px;height:120px;border-radius:50%;border:3px solid var(--ink);position:relative;background:#fff;flex:0 0 auto}
/* L'aiguille est un triangle CSS de 16x44 px dont la pointe basse touche le
   centre. Le pivot doit donc être en bas au centre (50% 100%) et non au
   milieu du triangle, sinon elle orbite au lieu de tourner sur elle-même. */
.compass .needle{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:50% 100%;
  border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:44px solid var(--flag);
  margin-left:-8px;margin-top:-44px;transition:transform .15s linear}
.compass .rose{position:absolute;top:0;right:0;bottom:0;left:0;transform-origin:center;transition:transform .15s linear}
.compass .dot{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.compass span{position:absolute;font-size:11px;font-weight:900}
.compass .N{top:4px;left:50%;transform:translateX(-50%);color:var(--err)} .compass .S{bottom:4px;left:50%;transform:translateX(-50%)}
.compass .E{right:7px;top:50%;transform:translateY(-50%)} .compass .O{left:7px;top:50%;transform:translateY(-50%)}
.bigtime{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:1px}
.bigtime.late{color:var(--err)}
#video{width:100%;border-radius:12px;border:2px solid var(--ink);background:#000}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td.num,th.num{text-align:right}
tr.actrow>td{background:#FBF9F3;padding:10px}
tr.sel>td{background:#FFF6EE}
.rank{display:inline-block;min-width:26px;text-align:center;font-family:var(--mono);font-weight:700;border-radius:6px;padding:1px 4px;background:#F1EEE6}
.rank.r1{background:#F4D35E}.rank.r2{background:#D9D9D9}.rank.r3{background:#E3B587}
/* Le tableau de suivi peut dépasser la largeur d'un téléphone en portrait :
   on le rend défilable horizontalement et on masque les colonnes secondaires. */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap table{min-width:100%}
@media (max-width:560px){
  table{font-size:12px}
  th,td{padding:6px 4px}
  .col-opt{display:none}
}
.qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:860px){ #app.wide .qrgrid{grid-template-columns:repeat(4,1fr)} }
.qrcard{border:2px solid var(--ink);border-radius:10px;padding:12px;text-align:center;background:#fff}
.qrcard .qrbox,.qrbox{display:flex;justify-content:center;margin:8px 0}
.qrcard .flaghead{height:10px;border-radius:4px 4px 0 0;margin:-12px -12px 8px;
  background:linear-gradient(135deg,#fff 0 50%,var(--flag) 50% 100%);border-bottom:2px solid var(--ink)}
.joinqr{cursor:zoom-in;display:inline-block;padding:8px;background:#fff;border:1.5px solid var(--line);border-radius:10px}
.clueimg{width:100%;border:1.5px solid var(--ink);border-radius:10px;margin-top:8px;display:block;background:#EFEAE0;min-height:60px;cursor:zoom-in}
/* Pastille « toucher pour agrandir » posée sur l'image */
.imgwrap{position:relative;margin-top:8px}
.imgwrap .clueimg{margin-top:0}
.imgwrap .zoomhint{position:absolute;right:8px;bottom:8px;background:rgba(30,36,32,.82);color:#fff;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;pointer-events:none;display:flex;align-items:center;gap:4px}
/* Visionneuse plein écran */
.lightbox{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:rgba(20,24,21,.94);display:flex;
  align-items:center;justify-content:center;overflow:hidden;touch-action:none;animation:lbin .18s ease-out}
.lightbox.white{background:#fff;flex-direction:column;gap:14px;padding:20px;touch-action:auto}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:100%;max-height:100%;transform-origin:center center;will-change:transform;
  user-select:none;-webkit-user-drag:none}
.lightbox .lbclose{position:absolute;top:14px;right:14px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);
  border-radius:50%;width:42px;height:42px;font-size:22px;font-weight:700;line-height:1;padding:0;box-shadow:none;z-index:2}
.lightbox .lbtip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;
  font-size:12px;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:99px;pointer-events:none;
  transition:opacity .4s;text-align:center;max-width:90%}
.lightbox .lbzoom{position:absolute;top:18px;left:18px;color:#fff;font-size:12px;font-weight:700;
  background:rgba(0,0,0,.45);padding:5px 11px;border-radius:99px;pointer-events:none;opacity:0;transition:opacity .25s}
.lightbox.white .qrbig{display:flex;justify-content:center}
.lightbox.white .qrbig img,.lightbox.white .qrbig canvas{max-width:min(82vw,70vh)!important;height:auto!important}
.lightbox.white h2{margin:0;text-align:center;font-size:24px}
.lightbox.white .url{font-family:var(--mono);font-size:13px;word-break:break-all;text-align:center;color:#4A4A42;max-width:90vw}
.syncline{display:flex;align-items:center;gap:8px;font-size:13px}
.hidden{display:none!important}
.center{text-align:center}
.divider{border:none;border-top:1.5px dashed var(--line);margin:16px 0}
/* Affiche A4 imprimable */
.poster{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6mm;padding:4mm 0;font-family:'Archivo',system-ui,sans-serif;color:#1E2420}
.poster .p-flag{width:16mm;height:16mm;border-radius:3mm;border:1mm solid #1E2420;background:linear-gradient(135deg,#fff 0 50%,#E8590C 50% 100%)}
.poster h1{font-size:30pt;line-height:1.1}
.poster .p-sub{font-size:13pt;color:#4A4A42}
.poster .p-qr img,.poster .p-qr canvas{width:120mm!important;height:120mm!important}
.poster .p-url{font-family:'IBM Plex Mono',monospace;font-size:10pt;word-break:break-all;max-width:170mm}
.poster ol{text-align:left;font-size:14pt;line-height:1.5;max-width:165mm;padding-left:8mm}
.poster ol li{margin:1.5mm 0}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body::before{display:none}
  body{background:#fff}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;top:0;left:0;width:100%}
  .qrgrid{grid-template-columns:1fr 1fr!important}
  .qrcard{page-break-inside:avoid;break-inside:avoid}
  .poster{page-break-inside:avoid;break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
/* =====================================================================
   STOCKAGE SUPABASE — remplissez ce bloc AVANT de mettre le fichier
   en ligne. Laissez-le vide pour un usage local sans partage.

     url : l'adresse de votre projet Supabase
           (Project Settings → Data API → Project URL)
           exemple : https://abcdefgh.supabase.co
     key : la clé publique « anon / publishable »
           (Project Settings → API Keys → anon public)

   Cette clé est CONÇUE pour figurer dans le code d'une page publique :
   c'est ainsi que Supabase fonctionne. La protection ne repose pas sur
   son secret mais sur les règles d'accès définies côté serveur, qui
   limitent cette clé à la seule table de l'application. Contrairement à
   un jeton GitHub, elle ne sera donc jamais révoquée automatiquement.

   Le script de création de la table figure dans le guide d'installation.
   ===================================================================== */
const SUPA = { url:'https://agujguaubnhisqywboue.supabase.co', key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFndWpndWF1Ym5oaXNxeXdib3VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY0NDAsImV4cCI6MjEwMzE1MjQ0MH0.A1hPY6sXTIhIVVcLOeXzbn5Dad4xHsi6Ahzd0SqbjyA' };
const TABLE = 'balise_kv';
const APP_VERSION = '2026-10-03';

/* Trois environnements possibles :
   - SUPABASE : base de données partagée → les équipes rejoignent la course
   - ARTEFACT : window.storage existe (appli publiée) → partage également
   - AUTONOME : fichier ouvert localement → localStorage, sur cet appareil seulement */
const SB_ON = !!(SUPA.url && SUPA.key);
const ART_ON = !SB_ON && !!window.storage;
const SHARED_MODE = SB_ON || ART_ON;
const LS = 'balise:';

/* ============ ÉTAT GLOBAL ============ */
const S = {
  view:'home', orgaTab:'postes', suiviTab:'active',
  raceId:null, config:null, races:[], team:null,
  unlocked:false, admin:null,
  openPosts:new Set(), postSearch:'',
  openTeam:null, allTeams:[], suiviSig:'', suiviAt:0, suiviErr:'',
  timers:{}, scanStream:null, scanRAF:null, busy:false,
  gpsTested:false, compassAsked:false, compassHooked:false
};

/* ============ OUTILS ============ */
const el = id=>document.getElementById(id);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o=>o==null? o : JSON.parse(JSON.stringify(o));
const uid = ()=>{
  const a='abcdefghijklmnopqrstuvwxyz0123456789';
  let s='';
  if(window.crypto && crypto.getRandomValues){ const b=new Uint8Array(10); crypto.getRandomValues(b); b.forEach(x=>s+=a[x%36]); }
  else for(let i=0;i<10;i++) s+=a[Math.floor(Math.random()*36)];
  return s;
};
const TOKEN_ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newToken(cfg){
  const pris=new Set(((cfg&&cfg.posts)||[]).map(p=>p.token));
  for(let essai=0;essai<200;essai++){
    let t=''; for(let i=0;i<6;i++) t+=TOKEN_ALPHA[Math.floor(Math.random()*TOKEN_ALPHA.length)];
    if(!pris.has(t)) return t;
  }
  return uid().slice(0,6).toUpperCase();
}
/* Durée en ms -> « mm:ss » ou « hh:mm:ss » (valeur absolue) */
const fmtT = ms=>{ ms=Math.abs(ms||0); const s=Math.floor(ms/1000); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return (h? String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); };
/* Durée signée : « −01:30 » quand le temps limite est dépassé */
const fmtSigned = ms=>(ms<0? '\u2212':'')+fmtT(ms);
const fmtClock = t=>new Date(t).toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtDateTime = t=>new Date(t).toLocaleString('fr-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
/* Comparaison souple : ignore casse, accents, ponctuation et espaces en trop */
function normalize(s){
  return String(s||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}
/* Plusieurs réponses acceptées, séparées par « | » */
function answerMatches(answer, saisie){
  const n=normalize(saisie); if(!n) return false;
  return String(answer||'').split('|').map(normalize).filter(Boolean).includes(n);
}
/* Distance entre deux points GPS en mètres (formule de haversine) */
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, r=x=>x*Math.PI/180;
  const dLat=r(lat2-lat1), dLon=r(lon2-lon1);
  const h=Math.sin(dLat/2)**2 + Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function minDefined(x,y){ if(x==null) return y==null? null : y; if(y==null) return x; return Math.min(x,y); }
function clampNum(v, min, max, def){ const n=Number(v); if(v===''||v==null||isNaN(n)) return def; return Math.min(max, Math.max(min, n)); }
/* Cellule CSV : guillemets doublés, et neutralisation des formules (=, +, -, @)
   dans les champs texte saisis par les participants. */
function csvCell(v, texte){
  let s=String(v??'');
  if(texte && /^[=+\-@\t\r]/.test(s)) s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* SHA-256 (empreinte du code PIN) — implémentation autonome, sans dépendre
   d'un contexte sécurisé. Constantes dérivées des nombres premiers. */
const SHA_K=(()=>{ const k=[]; let n=2; while(k.length<64){ let p=true; for(let d=2;d*d<=n;d++) if(n%d===0){p=false;break;} if(p) k.push(Math.floor((Math.cbrt(n)%1)*4294967296)>>>0); n++; } return k; })();
function sha256(str){
  const bytes=new TextEncoder().encode(String(str));
  const l=bytes.length, total=((l+9+63)>>6)<<6;
  const m=new Uint8Array(total); m.set(bytes); m[l]=0x80;
  const dv=new DataView(m.buffer);
  const bits=l*8;
  dv.setUint32(total-4, bits>>>0); dv.setUint32(total-8, Math.floor(bits/4294967296));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Uint32Array(64);
  const rot=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){
      const s0=rot(w[t-15],7)^rot(w[t-15],18)^(w[t-15]>>>3);
      const s1=rot(w[t-2],17)^rot(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const t1=(h+(rot(e,6)^rot(e,11)^rot(e,25))+((e&f)^(~e&g))+SHA_K[t]+w[t])|0;
      const t2=((rot(a,2)^rot(a,13)^rot(a,22))+((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

/* =====================================================================
   STOCKAGE
   Principes :
   - Toute lecture « stricte » distingue « la donnée n'existe pas » (null)
     de « la base est injoignable » (erreur) : on ne prend JAMAIS une panne
     réseau pour une absence de données.
   - Les fiches d'équipe ne sont jamais écrasées : on relit la version en
     base, on fusionne, et l'écriture n'aboutit que si personne ne l'a
     modifiée entre-temps (sinon on recommence).
   - Les écritures qui échouent sont conservées sur l'appareil (file
     persistante) et renvoyées dès que le réseau revient, même après une
     fermeture de la page.
   ===================================================================== */
const memStore = {};   // dernier état connu de chaque clé

/* ---- Persistance locale (mode autonome uniquement) ---- */
function lsLoadAll(){
  if(SHARED_MODE) return;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith(LS+'co:')){
        try{ memStore[k.slice(LS.length)]=JSON.parse(localStorage.getItem(k)); }catch(e){}
      }
    }
  }catch(e){}
}
function lsSet(key,val){
  if(SHARED_MODE) return;
  try{ localStorage.setItem(LS+key, JSON.stringify(val)); S.quotaFull=false; }
  catch(e){ S.quotaFull=true; }
}
function lsDel(key){ if(!SHARED_MODE){ try{ localStorage.removeItem(LS+key); }catch(e){} } }

/* ---- File d'attente persistante des écritures non envoyées ---- */
const PENDING_KEY = LS+'pending';
let pending = {};
function loadPending(){
  try{ const p=JSON.parse(localStorage.getItem(PENDING_KEY)||'{}'); pending=(p&&typeof p==='object')? p : {}; }
  catch(e){ pending={}; }
}
function persistPending(){
  try{ localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); S.pendingVolatile=false; }
  catch(e){ S.pendingVolatile=true; }   // stockage plein ou interdit : la file ne vit qu'en mémoire
}
function queueWrite(key, kind, value){
  pending[key]={kind, v:clone(value), at:Date.now()};
  persistPending(); updateSyncUI();
}
function unqueue(key, item){
  if(!(key in pending)) return;
  if(item && pending[key]!==item) return;   // une version plus récente a été mise en file entre-temps
  delete pending[key]; persistPending();
}
function pendingCount(){ return Object.keys(pending).length; }

/* ---- Accès à Supabase via son API REST ---- */
class NetError extends Error{ constructor(msg,status){ super(msg); this.net=true; this.status=status||0; } }
const sbHead = extra=>Object.assign({
  'apikey': SUPA.key,
  'Authorization': 'Bearer '+SUPA.key,
  'Content-Type': 'application/json'
}, extra||{});
/* Tolère les variantes d'adresse copiées depuis Supabase :
   avec ou sans barre finale, avec ou sans le suffixe /rest/v1 déjà présent. */
const sbRoot = ()=>SUPA.url.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
const sbBase = ()=>sbRoot()+'/rest/v1/'+TABLE;
const qk = key=>'cle=eq.'+encodeURIComponent(key);

/* Requête avec délai maximal : une 4G agonisante ne doit pas bloquer l'appli */
async function sbFetch(query, opts){
  const ctl=(typeof AbortController!=='undefined')? new AbortController() : null;
  const timer=ctl? setTimeout(()=>ctl.abort(), 20000) : null;
  try{
    return await fetch(sbBase()+query, Object.assign({cache:'no-store'}, opts||{}, ctl?{signal:ctl.signal}:{}));
  }catch(e){
    throw new NetError(e && e.name==='AbortError'? 'délai dépassé' : 'réseau indisponible');
  }finally{ if(timer) clearTimeout(timer); }
}
async function sbError(r){
  let detail='';
  try{ const txt=await r.text(); try{ const j=JSON.parse(txt); detail=[j.message,j.hint,j.details].filter(Boolean).join(' — '); }catch(e){ detail=txt.slice(0,200); } }
  catch(e){}
  return 'HTTP '+r.status+(detail? ' · '+detail : '');
}
async function sbCheck(r){ if(!r.ok) throw new NetError(await sbError(r), r.status); return r; }
/* Lecture d'une ligne avec son horodatage de modification (pour l'écriture conditionnelle) */
async function sbGetRow(key){
  let r=await sbFetch('?'+qk(key)+'&select='+(S.noCAS?'cle,valeur':'cle,valeur,modifie_le'),{headers:sbHead()});
  if(r.status===400 && !S.noCAS){
    const txt=await r.text();
    if(/modifie_le/.test(txt)){   // table créée sans la colonne d'horodatage : on s'en passe
      S.noCAS=true;
      r=await sbFetch('?'+qk(key)+'&select=cle,valeur',{headers:sbHead()});
    } else throw new NetError('HTTP 400 · '+txt.slice(0,160),400);
  }
  await sbCheck(r);
  const rows=await r.json();
  return rows.length? rows[0] : null;
}
async function sbUpsert(key,val){
  const r=await sbFetch('',{method:'POST',headers:sbHead({'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({cle:key,valeur:val})});
  await sbCheck(r);
}
/* Insertion stricte : false si la clé vient d'être créée par un autre appareil */
async function sbInsert(key,val){
  const r=await sbFetch('',{method:'POST',headers:sbHead({'Prefer':'return=minimal'}),body:JSON.stringify({cle:key,valeur:val})});
  if(r.status===409) return false;
  await sbCheck(r); return true;
}
/* Mise à jour conditionnelle : n'aboutit que si la ligne n'a pas changé depuis la lecture */
async function sbPatchIf(key,val,stamp){
  let q='?'+qk(key);
  if(!S.noCAS && stamp) q+='&modifie_le=eq.'+encodeURIComponent(stamp);
  const r=await sbFetch(q,{method:'PATCH',headers:sbHead({'Prefer':'return=representation'}),body:JSON.stringify({valeur:val})});
  await sbCheck(r);
  const rows=await r.json();
  return Array.isArray(rows) && rows.length>0;
}
async function sbDelete(key){ const r=await sbFetch('?'+qk(key),{method:'DELETE',headers:sbHead()}); await sbCheck(r); }
async function sbListRows(prefix, withValues){
  const r=await sbFetch('?cle=like.'+encodeURIComponent(prefix+'*')+'&select='+(withValues?'cle,valeur':'cle'),{headers:sbHead()});
  await sbCheck(r);
  return await r.json();
}

/* ---- Interface de stockage unifiée ---- */
/* Lecture stricte : null = la donnée n'existe pas ; erreur = base injoignable */
async function stGetStrict(key){
  if(SB_ON){
    const row=await sbGetRow(key);
    const v=row? row.valeur : null;
    if(v!==null) memStore[key]=v; else if(!(key in pending)) delete memStore[key];
    return v;
  }
  if(ART_ON){
    try{ const r=await window.storage.get(key,true); const v=r? JSON.parse(r.value):null; if(v!==null) memStore[key]=v; return v; }
    catch(e){ return memStore[key]!==undefined? memStore[key] : null; }
  }
  return memStore[key]!==undefined? memStore[key] : null;
}
/* Lecture tolérante : en cas de panne réseau, renvoie le dernier état connu */
async function stGet(key){
  try{ return await stGetStrict(key); }
  catch(e){ return memStore[key]!==undefined? memStore[key] : null; }
}
/* Écriture simple (données de l'organisateur) ; mise en file si le réseau échoue */
async function stSet(key,val){
  memStore[key]=val;
  if(SB_ON){ try{ await sbUpsert(key,val); unqueue(key); }catch(e){ queueWrite(key,'set',val); } }
  else if(ART_ON){ try{ await window.storage.set(key,JSON.stringify(val),true); unqueue(key); }catch(e){ queueWrite(key,'set',val); } }
  else lsSet(key,val);
  updateSyncUI();
}
/* Écriture qui doit réussir immédiatement (index des courses, code PIN) */
async function stSetStrict(key,val){
  if(SB_ON) await sbUpsert(key,val);
  else if(ART_ON) await window.storage.set(key,JSON.stringify(val),true);
  else lsSet(key,val);
  memStore[key]=val; unqueue(key);
}
async function stDel(key){
  delete memStore[key];
  if(SB_ON){ try{ await sbDelete(key); unqueue(key); }catch(e){ queueWrite(key,'del',null); } }
  else if(ART_ON){ try{ await window.storage.delete(key,true); unqueue(key); }catch(e){ queueWrite(key,'del',null); } }
  else lsDel(key);
}
/* Toutes les valeurs d'un préfixe, en UNE requête (lève une erreur hors-ligne) */
async function stAllStrict(prefix){
  if(SB_ON){
    const rows=await sbListRows(prefix,true);
    const out=[];
    rows.forEach(x=>{ if(x.valeur!=null){ memStore[x.cle]=x.valeur; out.push({key:x.cle, v:x.valeur}); } });
    return out;
  }
  if(ART_ON){
    const r=await window.storage.list(prefix,true);
    const out=[];
    for(const k of (r&&r.keys)||[]){ const v=await stGetStrict(k); if(v!=null) out.push({key:k, v}); }
    return out;
  }
  return Object.keys(memStore).filter(k=>k.startsWith(prefix)).map(k=>({key:k, v:memStore[k]}));
}
async function stKeysStrict(prefix){
  if(SB_ON) return (await sbListRows(prefix,false)).map(x=>x.cle);
  if(ART_ON){ const r=await window.storage.list(prefix,true); return (r&&r.keys)||[]; }
  return Object.keys(memStore).filter(k=>k.startsWith(prefix));
}

/* ---- Écriture conditionnelle (comparer-et-échanger) ----
   compute(valeurEnBase) renvoie la nouvelle valeur, ou undefined pour ne rien
   écrire. Si un autre appareil a écrit entre la lecture et l'écriture, on
   relit et on recommence : aucune modification n'est jamais perdue. */
async function casWrite(key, compute){
  if(SB_ON){
    for(let essai=0;essai<6;essai++){
      const row=await sbGetRow(key);
      const next=compute(row? clone(row.valeur) : null);
      if(next===undefined) return row? row.valeur : null;
      const ok = row? await sbPatchIf(key,next,row.modifie_le) : await sbInsert(key,next);
      if(ok){ memStore[key]=next; return next; }
      await wait(100+Math.random()*300);
    }
    throw new NetError('conflit d\u2019écriture répété');
  }
  if(ART_ON){
    let cur=null;
    try{ const r=await window.storage.get(key,true); cur=r? JSON.parse(r.value):null; }catch(e){ cur=memStore[key]!==undefined? clone(memStore[key]) : null; }
    const next=compute(cur); if(next===undefined) return cur;
    await window.storage.set(key,JSON.stringify(next),true);
    memStore[key]=next; return next;
  }
  const next=compute(memStore[key]!==undefined? clone(memStore[key]) : null);
  if(next===undefined) return memStore[key]??null;
  memStore[key]=next; lsSet(key,next); return next;
}

/* =====================================================================
   FICHES D'ÉQUIPE
   {id, name, courseId, created, epoch, start, end, endMethod, finalOk,
    statut ('hc' = hors classement), left, scans:[{postId,t,method,lat,lon,acc}],
    ts:{champ: date de la dernière modification}, deleted (fiche supprimée)}
   - Les validations s'additionnent (union par poste), quel que soit l'appareil.
   - Les champs simples (fin, statut, énigme, nom) : la modification la plus
     récente l'emporte, champ par champ.
   - Une remise à zéro incrémente « epoch » : la progression de l'époque la
     plus récente l'emporte entièrement.
   - Une fiche supprimée reste marquée « deleted » et ne peut pas renaître.
   ===================================================================== */
const teamKey = (raceId,teamId)=>'co:team:'+raceId+':'+teamId;
function tsOf(t,k){ return (t && t.ts && t.ts[k]) || 0; }
function touch(t,k,when){ t.ts=t.ts||{}; t.ts[k]=when||Date.now(); }
function isSetVal(v){ return v!==null && v!==undefined && v!==false; }
function pickLWW(m,a,b,k,fields){
  const ta=tsOf(a,k), tb=tsOf(b,k);
  const src = ta!==tb? (ta>tb? a : b) : (isSetVal(a[fields[0]])? a : b);
  for(const f of fields) m[f] = src[f]===undefined? null : clone(src[f]);
}
function mergeTeams(a,b){
  if(!a) return clone(b);
  if(!b) return clone(a);
  if(a.deleted || b.deleted) return clone(a.deleted? a : b);
  const ea=a.epoch||0, eb=b.epoch||0;
  let m;
  if(ea!==eb){
    const w = ea>eb? a : b;
    m=clone(w);
    m.ts=Object.assign({}, w.ts||{});
    pickLWW(m,a,b,'name',['name']);
    pickLWW(m,a,b,'statut',['statut','left']);
    for(const k of ['name','statut']) m.ts[k]=Math.max(tsOf(a,k),tsOf(b,k));
  } else {
    m=clone(a);
    const parPoste=new Map();
    for(const s of [...(a.scans||[]),...(b.scans||[])]){
      if(!s || !s.postId) continue;
      const cur=parPoste.get(s.postId);
      if(!cur || (s.t||0)<(cur.t||0)){
        const keep=Object.assign({},s);
        if(cur && keep.lat==null && cur.lat!=null){ keep.lat=cur.lat; keep.lon=cur.lon; keep.acc=cur.acc; }
        parPoste.set(s.postId, keep);
      } else if(cur.lat==null && s.lat!=null){ cur.lat=s.lat; cur.lon=s.lon; cur.acc=s.acc; }
    }
    m.scans=[...parPoste.values()].sort((x,y)=>(x.t||0)-(y.t||0));
    m.start=minDefined(a.start,b.start);
    pickLWW(m,a,b,'end',['end','endMethod']);
    pickLWW(m,a,b,'finalOk',['finalOk']);
    pickLWW(m,a,b,'name',['name']);
    pickLWW(m,a,b,'statut',['statut','left']);
    m.ts={};
    for(const k of new Set([...Object.keys(a.ts||{}),...Object.keys(b.ts||{})])) m.ts[k]=Math.max(tsOf(a,k),tsOf(b,k));
  }
  m.created=minDefined(a.created,b.created);
  m.epoch=Math.max(ea,eb);
  return m;
}
/* Signature stable d'une fiche (détection de changement) */
function teamSig(t){
  if(!t) return '';
  if(t.deleted) return 'deleted';
  return JSON.stringify([t.epoch||0,t.name,t.start,t.end,t.endMethod,!!t.finalOk,t.statut||null,
    (t.scans||[]).map(s=>s.postId+'@'+s.t).sort()]);
}
/* Écriture d'une équipe depuis son téléphone : fusion avec la version en base */
function writeTeam(key, local){ return casWrite(key, remote=>mergeTeams(local, remote)); }
/* Modification par l'organisateur : on part de la version en base la plus fraîche */
function updateTeam(key, mutate){
  return casWrite(key, remote=>{
    if(!remote || remote.deleted) return undefined;
    return mutate(remote)===false? undefined : remote;
  });
}
/* Suppression définitive mais traçable : la fiche devient une « pierre tombale »
   qu'aucun téléphone désynchronisé ne peut ressusciter. */
function tombstoneTeam(key, id){
  return casWrite(key, remote=>({id, deleted:true, epoch:((remote&&remote.epoch)||0)+1, deletedAt:Date.now()}));
}

/* ---- Session de l'équipe : STRICTEMENT locale à l'appareil ---- */
const ME_KEY = LS+'me';
function getMe(){ try{ return JSON.parse(localStorage.getItem(ME_KEY)); }catch(e){ return null; } }
function setMe(v){ try{ localStorage.setItem(ME_KEY, JSON.stringify(v)); }catch(e){} }
function clearMe(){
  try{ localStorage.removeItem(ME_KEY); localStorage.removeItem(LS+'cache:race'); localStorage.removeItem(LS+'cache:team'); }catch(e){}
}
function storageWorks(){
  try{ const k=LS+'test'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; }
}
/* Copie locale de la course et de l'équipe : reprise possible même sans réseau */
function cacheRunner(){
  if(!SHARED_MODE) return;
  try{
    if(S.config && S.raceId) localStorage.setItem(LS+'cache:race', JSON.stringify({raceId:S.raceId, config:S.config}));
    if(S.team) localStorage.setItem(LS+'cache:team', JSON.stringify(S.team));
  }catch(e){}
}
function readRunnerCache(raceId, teamId){
  try{
    const r=JSON.parse(localStorage.getItem(LS+'cache:race')||'null');
    const t=JSON.parse(localStorage.getItem(LS+'cache:team')||'null');
    if(r && t && r.raceId===raceId && t.id===teamId) return {config:r.config, team:t};
  }catch(e){}
  return null;
}

/* ---- Enregistrement de l'équipe courante ----
   Les enregistrements sont mis en série : deux validations rapprochées ne
   peuvent pas se doubler ni s'effacer mutuellement. */
let teamChain=Promise.resolve();
function saveTeam(){
  const p=teamChain.then(saveTeamNow);
  teamChain=p.catch(()=>{});
  return p;
}
async function saveTeamNow(){
  if(!S.team || !S.raceId) return;
  const key=teamKey(S.raceId, S.team.id);
  setMe({raceId:S.raceId, teamId:S.team.id});
  cacheRunner();
  try{
    const avant=teamSig(S.team);
    const merged=await writeTeam(key, S.team);
    if(merged && merged.deleted){ teamWasDeleted(); return; }
    if(merged){ S.team=mergeTeams(S.team, merged); }
    unqueue(key);
    /* La base a apporté du nouveau (crédit de l'organisateur, autre téléphone) */
    if(teamSig(S.team)!==avant){
      if(finalizeIfComplete()) saveTeam();
      if(typeof rerenderIfSafe==='function') rerenderIfSafe();
    }
  }catch(e){
    queueWrite(key,'team',S.team);
  }
  cacheRunner(); updateSyncUI();
}
/* Parcours traditionnel devenu complet (y compris par fusion) : on pose la fin */
function finalizeIfComplete(){
  const t=S.team;
  if(!t || !S.config || isFree() || !t.start || t.end!=null) return false;
  const c=teamCourse(); if(!c || !isCourseComplete(t,c)) return false;
  t.end=Math.max(...t.scans.map(s=>s.t||0)); t.endMethod='parcours'; touch(t,'end');
  return true;
}
/* Renvoi des écritures en attente (toutes les 10 s, au retour du réseau,
   au retour sur la page, et au démarrage) */
async function flushPending(){
  if(!SHARED_MODE || S.flushing || !pendingCount()){ updateSyncUI(); return; }
  S.flushing=true;
  try{
    for(const key of Object.keys(pending)){
      const item=pending[key]; if(!item) continue;
      try{
        if(item.kind==='team'){
          const courante = S.team && S.raceId && key===teamKey(S.raceId,S.team.id);
          const local = courante? mergeTeams(S.team, item.v) : item.v;
          const merged=await writeTeam(key, local);
          if(courante){
            if(merged && merged.deleted){ unqueue(key); teamWasDeleted(); return; }
            S.team=mergeTeams(S.team, merged); cacheRunner();
          }
        } else if(item.kind==='del'){
          if(SB_ON) await sbDelete(key); else if(ART_ON) await window.storage.delete(key,true);
        } else {
          if(SB_ON) await sbUpsert(key,item.v); else if(ART_ON) await window.storage.set(key,JSON.stringify(item.v),true);
        }
        unqueue(key, item);
        S.lastSyncErr='';
      }catch(e){ S.lastSyncErr=e.message||'erreur'; break; }
    }
  } finally { S.flushing=false; updateSyncUI(); }
}
/* Indicateurs de synchronisation (tous les éléments .syncstat de la page) */
function updateSyncUI(){
  const n=pendingCount();
  document.querySelectorAll('.syncstat').forEach(b=>{
    if(!SHARED_MODE){ b.className='syncstat hidden'; return; }
    if(n){
      b.className='syncstat tag warn';
      b.textContent='\u23F3 '+n+' envoi'+(n>1?'s':'')+' en attente';
      b.title=S.lastSyncErr? 'Dernière erreur : '+S.lastSyncErr : 'Envoi dès que le réseau revient';
    } else {
      b.className='syncstat tag ok';
      b.textContent='\u2713 synchronisé';
      b.title='';
    }
  });
  document.querySelectorAll('.syncwarn').forEach(w=>{
    if(!SHARED_MODE || !n){ w.innerHTML=''; return; }
    w.innerHTML='<div class="banner warn">'+n+' envoi'+(n>1?'s':'')+' en attente de réseau.'
      +(S.pendingVolatile? ' <p>Ce téléphone ne peut pas les mettre de côté : <b>ne fermez surtout pas cette page</b> avant le retour du réseau.</p>'
                         : ' <p>Ils sont conservés sur ce téléphone et partiront automatiquement dès que le réseau reviendra. Évitez de fermer la page d\u2019ici là.</p>')
      +'</div>';
  });
}

/* =====================================================================
   RÈGLES DE COURSE (communes à l'organisateur et aux coureurs)
   ===================================================================== */
/* Type de course : 'classique' (séquence imposée), 'libre' (ordre libre,
   indices collectés), 'points' (ordre libre + score). Les courses créées
   avant l'apparition des types restent classiques. */
function raceType(cfg){ return ((cfg||S.config)||{}).type || 'classique'; }
function isFree(cfg){ return raceType(cfg)!=='classique'; }
function isPoints(cfg){ return raceType(cfg)==='points'; }
const TYPE_LABELS={classique:'Course traditionnelle',libre:'Ordre libre',points:'Course aux points'};
/* Moyens de validation acceptés par un poste, cumulables.
   Compatibilité avec l'ancien champ « mode » (qr / gps / both). */
function postMethods(p){
  if(!p) return [];
  if(Array.isArray(p.methods)) return p.methods;
  if(p.mode==='gps') return ['gps'];
  if(p.mode==='both') return ['qr','gps'];
  return ['qr'];
}
function postById(id,cfg){ cfg=cfg||S.config; return (cfg&&cfg.posts)? cfg.posts.find(p=>p.id===id)||null : null; }
function postName(id,cfg){ const p=postById(id,cfg); return p? p.name : '(poste supprimé)'; }
function postPoints(p){ if(!p || p.points==null || p.points==='') return 10; const n=Number(p.points); return isNaN(n)? 10 : n; }
function hasGpsCoords(p){ return p && p.lat!=null && p.lon!=null && !isNaN(p.lat) && !isNaN(p.lon); }
/* Poste d'arrivée (ordre libre / points) : il arrête le chrono */
function arrivalId(cfg){
  cfg=cfg||S.config;
  if(!cfg || !isFree(cfg) || !cfg.arrivalId) return null;
  return (cfg.posts||[]).some(p=>p.id===cfg.arrivalId)? cfg.arrivalId : null;
}
function arrivalPost(cfg){ const a=arrivalId(cfg); return a? postById(a,cfg) : null; }
/* Postes à collecter (tous sauf l'arrivée) */
function collectPosts(cfg){ cfg=cfg||S.config; const a=arrivalId(cfg); return ((cfg&&cfg.posts)||[]).filter(p=>p.id!==a); }
function teamCourse(t,cfg){ t=t||S.team; cfg=cfg||S.config; return (t&&cfg&&cfg.courses)? cfg.courses.find(c=>c.id===t.courseId)||null : null; }
function validatedIds(t){ return new Set(((t&&t.scans)||[]).map(s=>s.postId)); }
function scanOf(t,pid){ return ((t&&t.scans)||[]).find(s=>s.postId===pid)||null; }
/* Parcours classique : rang de la prochaine étape = première étape non validée.
   Ne dépend pas de l'ordre des validations dans la fiche (robuste aux fusions). */
function progressIndex(t,c){ const v=validatedIds(t); let i=0; while(c && i<c.steps.length && v.has(c.steps[i].postId)) i++; return i; }
function stepsDone(t,c){ const v=validatedIds(t); return c? c.steps.filter(s=>v.has(s.postId)).length : 0; }
function isCourseComplete(t,c){ return !!c && c.steps.length>0 && stepsDone(t,c)===c.steps.length; }
function limitMs(cfg){ cfg=cfg||S.config; return clampNum(cfg&&cfg.limitMin,1,1440,90)*60000; }
function deadlineOf(t,cfg){ return (t&&t.start)? t.start+limitMs(cfg) : null; }
function penaltyRate(cfg){ cfg=cfg||S.config; return (cfg.penaltyPerMin==null||cfg.penaltyPerMin==='')? 1 : clampNum(cfg.penaltyPerMin,0,1000,1); }
function durationOf(t,now){ if(!t||!t.start) return null; return (t.end!=null? t.end : (now||Date.now()))-t.start; }
/* Décompte des points : postes collectés (hors arrivée) + énigme − retard.
   Tant que l'équipe n'est pas arrivée, le retard est calculé « à l'instant ». */
function scoreOf(t,cfg,now){
  cfg=cfg||S.config; now=now||Date.now();
  const a=arrivalId(cfg);
  const faits=((t&&t.scans)||[]).filter(s=>s.postId!==a && postById(s.postId,cfg));
  let postsPts=0; faits.forEach(s=>{ postsPts+=postPoints(postById(s.postId,cfg)); });
  const enigme=(t&&t.finalOk)? (Number(cfg.finalPoints)||0) : 0;
  const dl=deadlineOf(t,cfg);
  const finT=(t&&t.end!=null)? t.end : ((t&&t.start)? now : null);
  const lateMs=(isFree(cfg) && dl!=null && finT!=null)? Math.max(0,finT-dl) : 0;
  const lateMin=Math.ceil(lateMs/60000);
  const penalty=isPoints(cfg)? lateMin*penaltyRate(cfg) : 0;
  return {collected:faits.length, postsPts, enigme, lateMs, lateMin, penalty,
          total:Math.max(0, postsPts+enigme-penalty), provisional:!(t&&t.end!=null)};
}
/* Statut affiché dans le suivi */
function teamStatus(t){ if(t.statut==='hc') return 'hc'; return t.end!=null? 'classee' : 'active'; }
/* Clé de classement : plus petite = meilleure */
function rankKey(t,cfg){
  const type=raceType(cfg);
  const dur=(t.start && t.end!=null)? t.end-t.start : Number.MAX_SAFE_INTEGER;
  if(type==='points'){ const s=scoreOf(t,cfg); return [-s.total, dur]; }
  if(type==='libre'){ const s=scoreOf(t,cfg); return [-s.collected, dur]; }
  const c=teamCourse(t,cfg); const done=stepsDone(t,c);
  return [isCourseComplete(t,c)? 0 : 1, -done, dur];
}
function cmpKeys(a,b){ for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }
/* Classement avec ex aequo : deux équipes à égalité parfaite partagent le rang */
function rankTeams(teams,cfg){
  const lst=teams.map(t=>({t, k:rankKey(t,cfg)})).sort((x,y)=>cmpKeys(x.k,y.k) || String(x.t.name).localeCompare(String(y.t.name),'fr'));
  let rang=0;
  lst.forEach((x,i)=>{ if(i===0 || cmpKeys(x.k,lst[i-1].k)!==0) rang=i+1; x.rank=rang; });
  return lst;
}
/* La course utilise-t-elle le GPS (test de localisation utile) ? */
function raceNeedsGPS(cfg,t){
  cfg=cfg||S.config;
  if(isFree(cfg)) return (cfg.posts||[]).some(p=>postMethods(p).includes('gps'));
  const c=teamCourse(t,cfg);
  return !!c && c.steps.some(s=>postMethods(postById(s.postId,cfg)).includes('gps'));
}
function raceNeedsCompass(cfg,t){
  cfg=cfg||S.config;
  if(isFree(cfg)) return false;
  const c=teamCourse(t,cfg);
  return !!c && c.steps.some(s=>s.compass || s.azimuth!=null);
}

/* =====================================================================
   VISIONNEUSE PLEIN ÉCRAN
   Écartement des deux doigts pour agrandir, rapprochement pour réduire,
   glissement pour se déplacer dans l'image agrandie, double-tape pour
   basculer. Fermeture par la croix, le fond, Échap ou le bouton retour.
   ===================================================================== */
const LB = {el:null, scale:1, x:0, y:0, d0:0, s0:1, px:0, py:0, moving:false, lastTap:0, histo:false};
/* Ouvre un calque plein écran. Une seule entrée d'historique par calque :
   le bouton « retour » du téléphone le ferme au lieu de quitter la page. */
function openOverlay(cls, html){
  if(LB.el){ LB.el.remove(); LB.el=null; }       // on réutilise l'entrée d'historique déjà posée
  const box=document.createElement('div');
  box.className='lightbox '+(cls||'');
  box.innerHTML=html;
  document.body.appendChild(box);
  document.body.style.overflow='hidden';
  LB.el=box;
  if(!LB.histo){ try{ history.pushState({balise:'calque'},''); LB.histo=true; }catch(e){ LB.histo=false; } }
  const b=box.querySelector('.lbclose');
  if(b) b.onclick=e=>{ e.stopPropagation(); closeLightbox(); };
  return box;
}
function closeLightbox(depuisRetour){
  if(!LB.el) return;
  LB.el.remove(); LB.el=null;
  document.body.style.overflow='';
  const h=LB.histo; LB.histo=false;
  if(h && !depuisRetour){ try{ history.back(); }catch(e){} }
}
window.addEventListener('popstate',()=>{ if(LB.el){ LB.histo=false; closeLightbox(true); } });
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLightbox(); });

/* Génère le HTML d'une image d'indice avec sa pastille d'agrandissement */
function clueImgHtml(imgId, alt){
  if(!imgId) return '';
  return `<div class="imgwrap">
    <img data-imgid="${esc(imgId)}" class="clueimg" alt="${esc(alt||'Indice visuel')}" onclick="openLightbox(this)">
    <span class="zoomhint">&#128269; Toucher pour agrandir</span>
  </div>`;
}
function openLightbox(img){
  if(!img || !img.src) return;
  const box=openOverlay('', `<button class="lbclose" aria-label="Fermer">&times;</button>
    <span class="lbzoom" id="lbZoom">100 %</span>
    <img alt="">
    <span class="lbtip" id="lbTip">Écartez deux doigts pour agrandir · double-tapez pour basculer</span>`);
  LB.scale=1; LB.x=0; LB.y=0; LB.d0=0; LB.lastTap=0;
  const pic=box.querySelector('img');
  pic.src=img.src; pic.alt=img.alt||'';

  const apply=()=>{
    pic.style.transform=`translate(${LB.x}px,${LB.y}px) scale(${LB.scale})`;
    pic.style.cursor = LB.scale>1? 'grab':'zoom-out';
    const z=el('lbZoom');
    if(z){ z.textContent=Math.round(LB.scale*100)+' %'; z.style.opacity = LB.scale>1.02? '1':'0'; }
  };
  const clamp=()=>{
    LB.scale=Math.min(6, Math.max(1, LB.scale));
    if(LB.scale<=1){ LB.x=0; LB.y=0; return; }
    /* offsetWidth/Height donnent la taille AVANT transformation : indispensable,
       car getBoundingClientRect renverrait la taille déjà mise à l'échelle. */
    const w=pic.offsetWidth||window.innerWidth, h=pic.offsetHeight||window.innerHeight;
    const maxX=Math.max(0,(w*LB.scale-window.innerWidth)/2);
    const maxY=Math.max(0,(h*LB.scale-window.innerHeight)/2);
    LB.x=Math.min(maxX, Math.max(-maxX, LB.x));
    LB.y=Math.min(maxY, Math.max(-maxY, LB.y));
  };
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);

  box.addEventListener('touchstart',e=>{
    const tip=el('lbTip'); if(tip) tip.style.opacity='0';
    if(e.touches.length===2){
      LB.d0=dist(e.touches); LB.s0=LB.scale; LB.moving=false;
    } else if(e.touches.length===1){
      LB.px=e.touches[0].clientX; LB.py=e.touches[0].clientY;
      LB.moving = LB.scale>1;
      const now=Date.now();
      if(now-LB.lastTap<300){ // double-tape : bascule entre taille normale et 2,5x
        LB.scale = LB.scale>1? 1 : 2.5; LB.x=0; LB.y=0; clamp(); apply();
        LB.lastTap=0; e.preventDefault(); return;
      }
      LB.lastTap=now;
    }
  },{passive:false});
  box.addEventListener('touchmove',e=>{
    if(e.touches.length===2 && LB.d0){
      e.preventDefault();
      /* Écarter les doigts (distance qui augmente) agrandit ; rapprocher réduit */
      LB.scale = LB.s0 * (dist(e.touches)/LB.d0);
      clamp(); apply();
    } else if(e.touches.length===1 && LB.moving){
      e.preventDefault();
      LB.x += e.touches[0].clientX-LB.px;
      LB.y += e.touches[0].clientY-LB.py;
      LB.px=e.touches[0].clientX; LB.py=e.touches[0].clientY;
      clamp(); apply();
    }
  },{passive:false});
  box.addEventListener('touchend',e=>{ if(e.touches.length<2) LB.d0=0; });
  /* Molette à la souris, pour les tests sur ordinateur */
  box.addEventListener('wheel',e=>{
    e.preventDefault();
    LB.scale *= e.deltaY<0? 1.15 : 1/1.15;
    clamp(); apply();
  },{passive:false});
  box.onclick=e=>{ if(e.target===box) closeLightbox(); };
  pic.onclick=e=>{ e.stopPropagation(); if(LB.scale>1){ LB.scale=1; LB.x=0; LB.y=0; apply(); } else closeLightbox(); };
  apply();
  setTimeout(()=>{ const t=el('lbTip'); if(t) t.style.opacity='0'; },4000);
}
/* Images : chargement différé depuis le stockage, avec cache mémoire */
const imgCache={};
async function hydrateImgs(){
  const nodes=document.querySelectorAll('img[data-imgid]:not([src])');
  for(const n of nodes){
    const id=n.dataset.imgid;
    if(!imgCache[id]){ const d=await stGet('co:img:'+id); if(d) imgCache[id]=d; }
    if(imgCache[id]) n.src=imgCache[id];
    else n.alt='Image indisponible';
  }
}
/* Génération d'un QR code, robuste à l'absence de la bibliothèque */
function makeQR(node, text, size){
  if(!node) return;
  try{ new QRCode(node,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ node.innerHTML='<p class="muted">QR code indisponible : bibliothèque non chargée (connexion ?).</p>'; }
}
/* Adresse à partager : lien direct vers la course quand c'est possible */
function joinUrl(){
  if(SB_ON && /^https?:$/.test(location.protocol) && S.raceId)
    return location.origin+location.pathname+'?course='+encodeURIComponent(S.raceId);
  return location.href.split('#')[0];
}
function openQrFull(){

  const url=joinUrl();
  const box=openOverlay('white', `<button class="lbclose" aria-label="Fermer">&times;</button>

  const taille=Math.max(220, Math.min(900, Math.floor(Math.min(window.innerWidth*0.82, window.innerHeight*0.62))));

}

/* ---- Index des courses : lectures strictes, jamais d'écrasement à l'aveugle ---- */
async function loadRacesStrict(){
  const r=await stGetStrict('co:races');
  S.races=Array.isArray(r)? r : [];
  return S.races;
}
/* Relit l'index en base, applique la modification, l'écrit. Si la base est
   injoignable, rien n'est écrit : on ne remplace jamais l'index par une
   liste incomplète. */
async function updateRaces(fn){
  const list=clone(await loadRacesStrict());
  fn(list);
  await stSetStrict('co:races', list);
  S.races=list;
  return list;
}
/* Forme minimale garantie d'une configuration (sans rien modifier d'autre) */
function ensureConfigShape(cfg){
  if(!cfg) return cfg;
  if(!Array.isArray(cfg.posts)) cfg.posts=[];
  if(!Array.isArray(cfg.courses)) cfg.courses=[];
  cfg.courses.forEach(c=>{ if(!Array.isArray(c.steps)) c.steps=[]; });
  return cfg;
}
/* Réparations côté organisateur : identifiants manquants, QR en double,
   arrivée pointant vers un poste supprimé. Renvoie true si quelque chose a changé. */
function repairConfig(cfg){
  ensureConfigShape(cfg);
  let change=false;
  const vus=new Set();
  /* Identifiants sûrs uniquement (ils figurent dans les boutons de l'éditeur) :
     un fichier importé aux identifiants farfelus est normalisé, références comprises. */
  const sur=/^[A-Za-z0-9_-]{1,40}$/;
  const renomme={};
  cfg.posts.forEach(p=>{ if(p.id && !sur.test(String(p.id))){ const n=uid(); renomme[p.id]=n; p.id=n; change=true; } });
  if(Object.keys(renomme).length){
    cfg.courses.forEach(c=>c.steps.forEach(st=>{ if(renomme[st.postId]) st.postId=renomme[st.postId]; }));
    if(renomme[cfg.arrivalId]) cfg.arrivalId=renomme[cfg.arrivalId];
  }
  cfg.courses.forEach(c=>{ if(!c.id || !sur.test(String(c.id))){ c.id=uid(); change=true; } });
  cfg.posts.forEach(p=>{
    if(!p.id){ p.id=uid(); change=true; }
    if(!p.token || vus.has(p.token)){ p.token=newToken(cfg); change=true; }
    vus.add(p.token);
  });
  if(cfg.arrivalId && !cfg.posts.some(p=>p.id===cfg.arrivalId)){ cfg.arrivalId=null; change=true; }
  return change;
}
function imageIdsOf(cfg){
  const s=new Set();
  (cfg.posts||[]).forEach(p=>{ if(p.imgId) s.add(p.imgId); });
  (cfg.courses||[]).forEach(c=>(c.steps||[]).forEach(st=>{ if(st.imgId) s.add(st.imgId); }));
  return [...s];
}

/* ---- Code PIN : conservé sous forme d'empreinte, jamais en clair ---- */
function pinHash(pin, salt){ return sha256('balise:'+salt+':'+String(pin)); }
function pinOk(admin, pin){
  if(!admin) return false;
  if(admin.hash && admin.salt) return pinHash(pin, admin.salt)===admin.hash;
  return admin.pin!=null && String(admin.pin)===String(pin);   // ancien format (en clair)
}
function newAdmin(pin){ const salt=uid(); return {v:2, salt, hash:pinHash(pin,salt), changed:Date.now()}; }

async function orgaLogin(first){
  const pinEl=el('pin'), msg=el('loginMsg'), btn=el('loginBtn');
  if(!pinEl || !msg) return;
  const pin=(pinEl.value||'').trim();
  if(!pin){ msg.innerHTML='<div class="banner err">Saisissez un code PIN.</div>'; return; }
  if(first){
    if(pin.length<4){ msg.innerHTML='<div class="banner err">Le code doit comporter au moins 4 caractères.</div>'; return; }
    if(pin!==((el('pin2')||{}).value||'').trim()){ msg.innerHTML='<div class="banner err">Les deux codes ne correspondent pas.</div>'; return; }
    if(btn) btn.disabled=true;
    try{
      const existant=await stGetStrict('co:admin');   // créé entre-temps depuis un autre appareil ?
      if(existant){ S.admin=existant; msg.innerHTML='<div class="banner info">Un espace organisateur existe déjà : saisissez son code PIN.</div>'; setTimeout(render,1500); return; }
      const admin=newAdmin(pin);

    try{ const a=newAdmin(pin); await stSetStrict('co:admin',a); S.admin=a; }catch(e){}

async function createRace(){

  const type=(el('newRaceType')||{}).value||'classique';
  const seed=el('newRaceSeed');

    cfg.limitMin=90; cfg.penaltyPerMin=1;
    cfg.finalQuestion=''; cfg.finalAnswer=''; cfg.finalPoints=0; cfg.arrivalId=null;
  }

    await stSetStrict('co:race:'+id, cfg);

  }catch(e){

async function openRace(id){
  let cfg;
  try{ cfg=await stGetStrict('co:race:'+id); }
  catch(e){ alert('Base injoignable : '+e.message); return; }
  if(!cfg){ alert('Course introuvable.'); return; }
  const repare=repairConfig(cfg);
  Object.assign(S,{raceId:id, config:cfg, orgaTab:'postes', openPosts:new Set(), postSearch:'',
    openTeam:null, suiviTab:'active', allTeams:[], suiviSig:'', suiviAt:0, suiviErr:'', creditSel:{}});
  if(repare) saveConfig();
  /* L'index peut ignorer le type (anciennes duplications/imports) : on le recale */
  const e=S.races.find(r=>r.id===id);
  if(e && ((e.type||'classique')!==raceType(cfg) || e.name!==cfg.title)){
    updateRaces(list=>{ const x=list.find(r=>r.id===id); if(x){ x.type=raceType(cfg); x.name=cfg.title; } }).catch(()=>{});
  }
  go('orga');
}
/* Chaque copie possède ses propres images : en retirer une ne touche pas l'original */
async function cloneImagesOf(cfg){
  const map={};
  const dup=async old=>{
    if(!old) return null;
    if(map[old]!==undefined) return map[old];
    const d=await stGetStrict('co:img:'+old);
    if(!d){ map[old]=null; return null; }
    const n=uid(); await stSetStrict('co:img:'+n, d); imgCache[n]=d; map[old]=n; return n;
  };
  for(const p of cfg.posts||[]) if(p.imgId) p.imgId=await dup(p.imgId);
  for(const c of cfg.courses||[]) for(const s of c.steps||[]) if(s.imgId) s.imgId=await dup(s.imgId);
}
async function duplicateRace(id){
  try{
    const src=await stGetStrict('co:race:'+id);
    if(!src){ alert('Course introuvable.'); return; }
    const copy=clone(src);
    ensureConfigShape(copy);
    copy.title=(src.title||'Course')+' (copie)'; copy.created=Date.now(); delete copy.nextCourseIdx;
    await cloneImagesOf(copy);
    const nid=uid();
    await stSetStrict('co:race:'+nid, copy);
    await updateRaces(list=>list.push({id:nid,name:copy.title,type:raceType(copy),created:Date.now(),archived:false}));
  }catch(e){ alert('Duplication impossible : '+e.message); }
  renderRaces();
}
async function toggleArchive(id){
  try{ await updateRaces(list=>{ const r=list.find(x=>x.id===id); if(r) r.archived=!r.archived; }); }
  catch(e){ alert('Base injoignable : '+e.message); }
  renderRaces();
}
async function delRace(id){
  const r=S.races.find(x=>x.id===id);
  if(!confirm('Supprimer définitivement « '+(r?r.name:'cette course')+' », ses postes, ses parcours, ses images et ses équipes ?')) return;
  try{
    const cfg=await stGetStrict('co:race:'+id);
    await updateRaces(list=>{ const i=list.findIndex(x=>x.id===id); if(i>=0) list.splice(i,1); });
    if(cfg) for(const iid of imageIdsOf(cfg)) await stDel('co:img:'+iid);
    for(const k of await stKeysStrict('co:team:'+id+':')) await stDel(k);
    await stDel('co:race:'+id);
  }catch(e){ alert('Suppression incomplète (base injoignable) : '+e.message); }
  renderRaces();
}

/* ---- Sauvegarde d'une course dans un fichier ---- */
async function exportRace(id){
  try{
    const cfg=await stGetStrict('co:race:'+id);
    if(!cfg){ alert('Course introuvable.'); return; }
    const imgs={};
    for(const iid of imageIdsOf(cfg)){ const d=await stGetStrict('co:img:'+iid); if(d) imgs[iid]=d; }
    download(safeName(cfg.title)+'.balise.json','application/json',
      JSON.stringify({format:'balise-course-v2', app:APP_VERSION, exported:new Date().toISOString(), config:cfg, images:imgs}));
  }catch(e){ alert('Export impossible : '+e.message); }
}
/* Lecture d'un fichier choisi par l'utilisateur, avec repli pour les
   navigateurs anciens (iOS < 14) qui ne connaissent pas file.text() */
function readFileText(f){
  if(f && typeof f.text==='function') return f.text();
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result||'')); r.onerror=()=>rej(new Error('lecture du fichier impossible')); r.readAsText(f); });
}
async function importRaceFile(input){
  const f=input.files && input.files[0]; if(!f) return;
  try{
    const pack=JSON.parse(await readFileText(f));
    if(!pack || !pack.config || !Array.isArray(pack.config.posts)) throw new Error('fichier non reconnu');
    const cfg=pack.config;
    repairConfig(cfg);
    /* Nouvelles images pour cette course : jamais partagées avec une autre */
    const map={};
    for(const old of Object.keys(pack.images||{})){ const n=uid(); await stSetStrict('co:img:'+n, pack.images[old]); map[old]=n; }
    cfg.posts.forEach(p=>{ if(p.imgId) p.imgId=map[p.imgId]||null; });
    cfg.courses.forEach(c=>c.steps.forEach(s=>{ if(s.imgId) s.imgId=map[s.imgId]||null; }));
    cfg.title=cfg.title||'Course importée';
    delete cfg.nextCourseIdx;
    const nid=uid();
    await stSetStrict('co:race:'+nid, cfg);
    await updateRaces(list=>list.push({id:nid,name:cfg.title,type:raceType(cfg),created:Date.now(),archived:false}));
    alert('Course « '+cfg.title+' » importée.');
  }catch(e){ alert('Import impossible : '+e.message); }
  input.value='';
  renderRaces();
}
function safeName(s){ return String(s||'course').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'')||'course'; }
function download(name, mime, content){
  const blob=new Blob([content],{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}

/* Problèmes de configuration d'un poste (affichés en pastille ⚠) */
function postProblems(p){
  const m=postMethods(p), pb=[];
  if(!m.length) pb.push('aucun moyen de validation');
  if(m.includes('gps') && !hasGpsCoords(p)) pb.push('coordonnées GPS manquantes');
  if(m.includes('code') && !String(p.answer||'').trim()) pb.push('réponse attendue vide');
  return pb;
}
/* Zones GPS qui se chevauchent : une équipe entre deux postes pourrait valider le mauvais */
function gpsOverlaps(cfg){
  const g=((cfg&&cfg.posts)||[]).filter(p=>postMethods(p).includes('gps') && hasGpsCoords(p));
  const out=[];
  for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++){
    const d=haversine(g[i].lat,g[i].lon,g[j].lat,g[j].lon);
    const r=(Number(g[i].radius)||30)+(Number(g[j].radius)||30);
    if(d<r) out.push({a:g[i], b:g[j], d:Math.round(d), r});
  }
  return out;
}
function postIssuesHtml(){
  const cfg=S.config, lignes=[];
  cfg.posts.forEach(p=>{ const pb=postProblems(p); if(pb.length) lignes.push('« '+esc(p.name)+' » : '+pb.join(', ')); });
  gpsOverlaps(cfg).forEach(o=>lignes.push('« '+esc(o.a.name)+' » et « '+esc(o.b.name)+' » ne sont qu\u2019à '+o.d+' m l\u2019un de l\u2019autre pour des rayons cumulés de '+o.r+' m : leurs zones de validation se chevauchent. '
    +(isFree()? 'L\u2019application valide le plus proche, mais réduisez un rayon ou éloignez les postes pour éviter toute confusion.'
              : 'Sans conséquence s\u2019ils ne se suivent pas dans un parcours ; sinon, réduisez un rayon.')));
  if(isFree() && S.config.arrivalId && !arrivalId()) lignes.push('Le poste d\u2019arrivée choisi n\u2019existe plus : choisissez-en un autre dans l\u2019onglet Réglages.');
  return lignes.length? `<div class="banner warn" style="margin-top:10px">À vérifier :<ul style="margin:6px 0 0 18px;font-weight:500">${lignes.map(x=>'<li>'+x+'</li>').join('')}</ul></div>` : '';
}

function filterPosts(q){
  S.postSearch=q||'';
  const n=normalize(S.postSearch);
  let visibles=0;
  document.querySelectorAll('#postGroups .pgroup').forEach(g=>{
    let vus=0;
    g.querySelectorAll('.pitem').forEach(it=>{
      const ok=!n || (it.dataset.search||'').includes(n) || it.classList.contains('open');
      it.style.display=ok? '' : 'none'; if(ok) vus++;
    });
    g.style.display=vus? '' : 'none'; visibles+=vus;
  });
  const nm=el('noMatch'); if(nm) nm.style.display=(n && !visibles)? '' : 'none';
}

/* ---- Coordonnées collées ---- */
/* Conversion coordonnées suisses CH1903+/LV95 (et LV03) vers WGS84 — formules swisstopo, précision ~1 m */
function lv95ToWgs(E,N){
  if(E<2000000){ E+=2000000; N+=1000000; } // ancien format LV03
  const y=(E-2600000)/1e6, x=(N-1200000)/1e6;
  const lon=(2.6779094 + 4.728982*y + 0.791484*y*x + 0.1306*y*x*x - 0.0436*y*y*y)*100/36;
  const lat=(16.9023892 + 3.238272*x - 0.270978*y*y - 0.002528*x*x - 0.0447*y*y*x - 0.0140*x*x*x)*100/36;
  return {lat:+lat.toFixed(6), lon:+lon.toFixed(6)};
}
function okLatLon(lat,lon){ return (isFinite(lat)&&isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180)? {lat,lon} : null; }
/* Analyse tout ce qu'on peut coller : décimales (point ou virgule), lien Google
   Maps, degrés-minutes-secondes, coordonnées ou lien de map.geo.admin.ch */
function parseCoords(str){
  if(!str) return null;
  str=String(str).trim();
  let m=str.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || str.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  if(m) return okLatLon(+m[1],+m[2]);
  const dms=/(\d{1,3})\s*°\s*(\d{1,2})\s*['′’]\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:"|″|''|”)?\s*([NSns])[\s,;]*(\d{1,3})\s*°\s*(\d{1,2})\s*['′’]\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:"|″|''|”)?\s*([EWOewo])/;
  m=str.match(dms);
  if(m){
    const v=(d,mi,s)=>Number(d)+Number(mi)/60+Number(String(s).replace(',','.'))/3600;
    let lat=v(m[1],m[2],m[3]), lon=v(m[5],m[6],m[7]);
    if(/[Ss]/.test(m[4])) lat=-lat;
    if(/[Ww]/.test(m[8])) lon=-lon;
    return okLatLon(+lat.toFixed(6), +lon.toFixed(6));
  }
  const cv=str.match(/^\s*(-?\d{1,3}),(\d+)\s*[;\s]\s*(-?\d{1,3}),(\d+)\s*$/);
  if(cv) return okLatLon(Number(cv[1]+'.'+cv[2]), Number(cv[3]+'.'+cv[4]));
  const s=str.replace(/[\u2019'`]/g,'').replace(/[°NEne]/g,' ');
  const raw=s.match(/-?\d+(?:\.\d+)?/g)||[];
  const nums=raw.map(Number);
  for(let i=0;i+1<nums.length;i++){ // priorité aux coordonnées suisses (paires de grands nombres)
    const a=nums[i], b=nums[i+1];
    if(a>=2450000&&a<=2850000&&b>=1050000&&b<=1300000) return lv95ToWgs(a,b);
    if(a>=450000&&a<=850000&&b>=50000&&b<=310000) return lv95ToWgs(a,b);
  }
  for(let i=0;i+1<nums.length;i++){ // sinon paire décimale lat/lon
    const a=nums[i], b=nums[i+1];
    if(raw[i].includes('.')&&raw[i+1].includes('.')&&Math.abs(a)<=90&&Math.abs(a)>=0.5&&Math.abs(b)<=180) return {lat:a, lon:b};
  }
  return null;
}
async function applyPastedCoords(id){
  const input=el('paste-'+id); if(!input) return;
  const c=parseCoords(input.value);
  if(!c){
    const msg=el('coordMsg-'+id);
    if(msg) msg.innerHTML='<div class="banner err" style="margin-top:6px">Format non reconnu. Collez « 46.7419, 7.2866 », un lien Google Maps, « 46°44\'30.8"N 7°17\'11.8"E » ou des coordonnées suisses « 2586500 / 1175000 ».</div>';
    return;
  }
  const p=postById(id); if(!p) return;
  p.lat=c.lat; p.lon=c.lon;
  tabPostes();
  const msg=el('coordMsg-'+id);
  if(msg) msg.innerHTML='<div class="banner ok" style="margin-top:6px">Coordonnées enregistrées : '+c.lat+', '+c.lon+'</div>';
  await saveConfig();
}
/* Capture sur le terrain : on exige une précision correcte, sinon le poste
   serait enregistré à côté de sa vraie position et deviendrait difficile à valider. */
async function markPostHere(id){
  const msg=el('coordMsg-'+id); if(!msg) return;
  msg.innerHTML='<p class="muted" style="margin-top:6px">Recherche de votre position… restez immobile, téléphone à découvert.</p>';
  const pos=await getPos(30000,(sec,best)=>{
    const e=el('coordMsg-'+id);
    if(e) e.innerHTML='<p class="muted" style="margin-top:6px">Recherche… '+sec+' s'+(best? ' · précision ±'+best.acc+' m':'')+'</p>';
  }, best=>best.acc<=8);
  const box=el('coordMsg-'+id);
  if(!pos){ if(box) box.innerHTML='<div class="banner err" style="margin-top:6px">'+esc(geoErrorMsg())+'</div>'; return; }
  if(pos.acc>25){
    S.captures=S.captures||{}; S.captures[id]=pos;
    if(box) box.innerHTML=`<div class="banner err" style="margin-top:6px">Précision insuffisante (±${pos.acc} m) : position non enregistrée. Un point aussi imprécis rendrait le poste difficile à valider.</div>
      <div class="row wrap"><button class="small fix" onclick="markPostHere('${id}')">Réessayer</button>
      <button class="small ghost fix" onclick="forceCapture('${id}')">Enregistrer quand même</button></div>`;
    return;
  }
  await saveCapture(id,pos);
}
async function saveCapture(id,pos){
  const p=postById(id); if(!p) return;
  p.lat=pos.lat; p.lon=pos.lon;
  tabPostes();
  const e=el('coordMsg-'+id);
  if(e) e.innerHTML='<div class="banner '+(pos.acc<=15?'ok':'warn')+'" style="margin-top:6px">Position enregistrée (précision ±'+pos.acc+' m).'
    +(pos.acc>15? ' Précision moyenne : refaites la capture à découvert si possible.':'')+'</div>';
  await saveConfig();
}
function forceCapture(id){ const pos=S.captures&&S.captures[id]; if(pos) saveCapture(id,pos); }

/* ---- Images d'indice (cartes / photos) ---- */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const MAX=900;
        const scale=Math.min(1, MAX/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale)); canvas.height=Math.max(1,Math.round(img.height*scale));
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        let q=0.72, data=canvas.toDataURL('image/jpeg',q);
        while(data.length>700000 && q>0.35){ q-=0.1; data=canvas.toDataURL('image/jpeg',q); }
        URL.revokeObjectURL(img.src);
        resolve(data);
      }catch(e){ reject(e); }
    };
    img.onerror=()=>reject(new Error('image illisible'));
    img.src=URL.createObjectURL(file);
  });
}
/* Enregistre la nouvelle image AVANT de supprimer l'ancienne : un échec
   réseau ne laisse jamais le poste sans image. */
async function storeImage(file){
  const data=await compressImage(file);
  const id=uid();
  await stSetStrict('co:img:'+id, data);
  imgCache[id]=data;
  return id;
}
async function pickPostImg(id,input){
  const file=input.files && input.files[0]; if(!file) return;
  input.disabled=true;
  try{
    const p=postById(id); if(!p) return;
    const ancien=p.imgId;
    p.imgId=await storeImage(file);
    tabPostes();
    await saveConfig();
    if(ancien) stDel('co:img:'+ancien);
  }catch(e){ alert('Image impossible à enregistrer : '+e.message); input.disabled=false; }
}
async function removePostImg(id){
  const p=postById(id); if(!p||!p.imgId) return;
  const ancien=p.imgId; p.imgId=null;
  tabPostes();
  await saveConfig(); stDel('co:img:'+ancien); delete imgCache[ancien];
}

function importPostsCard(){
  const autres=(S.races||[]).filter(r=>r.id!==S.raceId);
  if(!autres.length) return '';
  return `<div class="card stack">
    <h3>Importer des postes d'une autre course</h3>
    <p class="muted">Copie les postes choisis dans cette course, avec leurs coordonnées, codes, anecdotes et images. Leurs QR codes sont conservés : les cartes déjà posées sur le terrain restent valables. Les postes déjà présents (même QR) sont ignorés.</p>
    <div class="row wrap">
      <select id="impRace">${autres.map(r=>`<option value="${r.id}">${esc(r.name)}${r.archived?' (archivée)':''}</option>`).join('')}</select>
      <button class="fix" onclick="loadImportPosts()">Afficher ses postes</button>
    </div>
    <div id="impList"></div>
  </div>`;
}
async function loadImportPosts(){
  const sel=el('impRace'), box=el('impList'); if(!sel||!box) return;
  box.innerHTML='<p class="muted">Chargement…</p>';
  let src;
  try{ src=await stGetStrict('co:race:'+sel.value); }
  catch(e){ box.innerHTML='<div class="banner err">Base injoignable : '+esc(e.message)+'</div>'; return; }
  if(!src || !(src.posts||[]).length){ box.innerHTML='<p class="muted">Aucun poste dans cette course.</p>'; return; }
  S.importSrc=src;
  const tokens=new Set(S.config.posts.map(p=>p.token));
  box.innerHTML=`<div class="stack" style="margin-top:8px">
    <label class="inline"><input type="checkbox" onchange="document.querySelectorAll('.impchk:not(:disabled)').forEach(c=>c.checked=this.checked)"> <b>Tout sélectionner</b></label>
    ${src.posts.map(p=>{ const deja=tokens.has(p.token);
      return `<label class="inline"><input type="checkbox" class="impchk" value="${esc(p.id)}" ${deja?'disabled':''}> ${esc(p.name)}${p.zone?' <span class="tag mute">'+esc(p.zone)+'</span>':''}${deja?' <span class="muted">(déjà présent)</span>':''}</label>`; }).join('')}
    <button class="primary" id="impBtn" onclick="doImportPosts()">Importer la sélection</button>
  </div>`;
}
async function doImportPosts(){
  const ids=[...document.querySelectorAll('.impchk:checked')].map(c=>c.value);
  if(!ids.length){ alert('Cochez au moins un poste.'); return; }
  const src=S.importSrc; if(!src) return;
  const btn=el('impBtn'); if(btn) btn.disabled=true;
  const tokens=new Set(S.config.posts.map(p=>p.token));
  let n=0;
  try{
    for(const id of ids){
      const p=src.posts.find(x=>x.id===id);
      if(!p || tokens.has(p.token)) continue;
      const c=clone(p); c.id=uid();
      if(c.imgId){
        const d=await stGetStrict('co:img:'+c.imgId);
        if(d){ const nid=uid(); await stSetStrict('co:img:'+nid,d); imgCache[nid]=d; c.imgId=nid; } else c.imgId=null;
      }
      S.config.posts.push(c); tokens.add(c.token); n++;
    }
  }catch(e){ alert('Import interrompu : '+e.message); }
  tabPostes();
  alert(n+' poste'+(n>1?'s':'')+' importé'+(n>1?'s':'')+'.');
  if(n) await saveConfig();
}

function courseById(cid){ return S.config.courses.find(c=>c.id===cid)||null; }
function tabParcours(){
  el('tabBody').innerHTML=`
  ${!S.config.posts.length? '<div class="banner warn">Créez d\u2019abord des postes dans l\u2019onglet Postes.</div>':''}

function courseCard(c){

async function addCourse(){
  const n=S.config.courses.length;
  S.config.courses.push({id:uid(), name:'Parcours '+(n<26? String.fromCharCode(65+n) : (n+1)), steps:[]});
  tabParcours(); await saveConfig();
}
async function renameCourse(cid){
  const c=courseById(cid); if(!c) return;
  const n=prompt('Nom du parcours :', c.name);
  if(n==null) return;
  if(!n.trim()){ alert('Le nom ne peut pas être vide.'); return; }
  c.name=n.trim(); tabParcours(); await saveConfig();
}
async function delCourse(cid){
  const c=courseById(cid); if(!c) return;
  if(!confirm('Supprimer le parcours « '+c.name+' » ? Les équipes déjà inscrites sur ce parcours ne pourront plus continuer.')) return;
  S.config.courses=S.config.courses.filter(x=>x.id!==cid);
  tabParcours();
  await saveConfig();
  c.steps.forEach(s=>{ if(s.imgId) stDel('co:img:'+s.imgId); });
}
async function addStep(cid){
  const c=courseById(cid); if(!c) return;
  if(!S.config.posts.length){ alert('Créez d\u2019abord des postes.'); return; }
  const dejas=new Set(c.steps.map(s=>s.postId));
  const p=S.config.posts.find(x=>!dejas.has(x.id)) || S.config.posts[0];
  c.steps.push({postId:p.id, clueText:'', azimuth:null, dist:null});
  tabParcours(); await saveConfig();
}
async function setStepFlag(cid,i,k,v){
  const c=courseById(cid); if(!c||!c.steps[i]) return;
  c.steps[i][k]=!!v; await saveConfig();
}
async function setStepPost(cid,i,pid){
  const c=courseById(cid); if(!c||!c.steps[i]||!pid) return;
  c.steps[i].postId=pid; tabParcours(); await saveConfig();
}
async function setStepClue(cid,i,k,v){
  const c=courseById(cid); if(!c||!c.steps[i]) return;
  const s=c.steps[i];
  if(k==='clueText') s.clueText=v;
  else if(k==='azimuth'){ const n=Number(v); s.azimuth=(v===''||v==null||isNaN(n))? null : ((Math.round(n)%360)+360)%360; }
  else if(k==='dist'){ const n=Number(v); s.dist=(v===''||v==null||isNaN(n))? null : Math.max(0,Math.round(n)); }
  await saveConfig();
  if(k==='azimuth'){ const cb=el('cmp-'+cid+'-'+i); if(cb){ cb.checked=!!(s.compass||s.azimuth!=null); cb.disabled=s.azimuth!=null; } }
}
async function moveStep(cid,i,d){
  const c=courseById(cid); if(!c) return;
  const j=i+d; if(j<0||j>=c.steps.length) return;
  [c.steps[i],c.steps[j]]=[c.steps[j],c.steps[i]];
  tabParcours(); await saveConfig();
}
async function delStep(cid,i){
  const c=courseById(cid); if(!c||!c.steps[i]) return;
  const [s]=c.steps.splice(i,1);
  tabParcours();
  await saveConfig();
  if(s && s.imgId) stDel('co:img:'+s.imgId);
}
async function pickStepImg(cid,i,input){
  const file=input.files && input.files[0]; if(!file) return;
  input.disabled=true;
  try{
    const c=courseById(cid); if(!c||!c.steps[i]) return;
    const s=c.steps[i], ancien=s.imgId;
    s.imgId=await storeImage(file);
    tabParcours();
    await saveConfig();
    if(ancien) stDel('co:img:'+ancien);
  }catch(e){ alert('Image impossible à enregistrer : '+e.message); input.disabled=false; }
}
async function removeStepImg(cid,i){
  const c=courseById(cid); if(!c||!c.steps[i]||!c.steps[i].imgId) return;
  const ancien=c.steps[i].imgId; c.steps[i].imgId=null;
  tabParcours();
  await saveConfig(); stDel('co:img:'+ancien); delete imgCache[ancien];
}

/* Impression : seule la zone #printArea est visible sur papier */
function printZone(restore){
  const zone=el('printArea'); if(!zone) return;
  zone.classList.remove('hidden');
  let fait=false;
  const fin=()=>{
    if(fait) return; fait=true;
    window.removeEventListener('afterprint',fin);
    try{ if(restore) restore(); }catch(e){}
    zone.classList.add('hidden'); zone.innerHTML='';
  };
  window.addEventListener('afterprint',fin);
  setTimeout(()=>{
    try{ window.print(); }catch(e){}
    if(!('onafterprint' in window)) setTimeout(fin,1500);
  },80);
  setTimeout(fin,120000);   // filet ultime
}
function printQR(){
  const grid=el('qrgrid'), zone=el('printArea');
  if(!grid||!zone) return;
  /* On déplace l'élément réel (et non une copie HTML) : un canvas copié
     par innerHTML perdrait son image et la planche sortirait vide. */
  const ancre=document.createComment('qrgrid');
  grid.parentNode.insertBefore(ancre, grid);
  zone.innerHTML=''; zone.appendChild(grid);
  printZone(()=>{ if(ancre.parentNode){ ancre.parentNode.insertBefore(grid, ancre); ancre.remove(); } });
}
function printPoster(){
  const zone=el('printArea'); if(!zone||!S.config) return;
  const lignes=posterText().split('\n').map(s=>s.trim()).filter(Boolean);
  zone.innerHTML=`<div class="poster">
    <div class="p-flag"></div>
    <h1>${esc(S.config.title)}</h1>
    <div class="p-sub">${esc(TYPE_LABELS[raceType()])}</div>

    ${lignes.length? `<ol>${lignes.map(l=>'<li>'+esc(l)+'</li>').join('')}</ol>`:''}
  </div>`;
  makeQR(el('posterQR'), joinUrl(), 600);
  printZone();
}

  </div>

    <p class="muted small-txt">Postes à leurs coordonnées (ou à la moyenne des validations GPS). Rond orange : dernière position connue d'une équipe en course ; vert : équipe arrivée.</p>

      <button class="small danger fix" onclick="resetTeams()">Supprimer toutes les équipes</button>
    </div>
  </div>`;
  if(S.suiviAt) drawSuivi();   // affichage immédiat des dernières données connues
  refreshSuivi(true);
  setTimer('suivi', ()=>{ if(S.view==='orga' && S.orgaTab==='suivi') refreshSuivi(false); }, 20000);
  setTimer('suiviTick', tickSuivi, 1000);
}
async function refreshSuivi(force){
  if(S.suiviLoading){ if(force || !S.suiviAgain) S.suiviAgain=force? 'force' : 'soft'; return; }
  S.suiviLoading=true;
  try{
    const rows=await stAllStrict('co:team:'+S.raceId+':');
    const teams=rows.map(r=>r.v).filter(t=>t && t.id && !t.deleted);
    const sig=JSON.stringify(teams.map(teamSig).sort());
    S.suiviAt=Date.now(); S.suiviErr='';
    if(force || sig!==S.suiviSig){ S.allTeams=teams; S.suiviSig=sig; drawSuivi(); }
  }catch(e){
    S.suiviErr=e.message||'erreur';
    if(!S.suiviAt){ const b=el('suiviTable'); if(b) b.innerHTML=errorCard(S.suiviErr,'refreshSuivi(true)'); }
  }finally{
    S.suiviLoading=false; updateSuiviInfo();
    if(S.suiviAgain){ const f=S.suiviAgain==='force'; S.suiviAgain=null; refreshSuivi(f); }
  }
}
function drawSuivi(){
  const box=el('suiviTable'), tabs=el('suiviTabs');
  if(!box || !tabs) return;
  const y=window.scrollY||window.pageYOffset||0;
  const w=box.querySelector('.tablewrap'), sx=w? w.scrollLeft : 0;
  const groupes={active:[],classee:[],hc:[]};
  S.allTeams.forEach(t=>groupes[teamStatus(t)].push(t));
  if(S.openTeam && !S.allTeams.some(t=>t.id===S.openTeam)) S.openTeam=null;
  tabs.innerHTML=[['active','En course'],['classee','Classement'],['hc','Hors classement']]
    .map(([k,l])=>`<button class="${S.suiviTab===k?'on':''}" onclick="setSuiviTab('${k}')">${l} (${groupes[k].length})</button>`).join('');
  box.innerHTML=suiviTableHtml(S.suiviTab, groupes[S.suiviTab]);
  const w2=box.querySelector('.tablewrap'); if(w2) w2.scrollLeft=sx;
  if((window.scrollY||window.pageYOffset||0)!==y){ try{ window.scrollTo(0,y); }catch(e){} }
  drawSchematic(S.allTeams);
  tickSuivi();
}
function setSuiviTab(k){ S.suiviTab=k; S.openTeam=null; drawSuivi(); }
function toggleTeamPanel(id){ S.openTeam = S.openTeam===id? null : id; drawSuivi(); }
/* Avancement d'une équipe (pour trier la page « en course ») */
function avancement(t){
  const cfg=S.config;
  if(isPoints()) return scoreOf(t,cfg).total;
  if(isFree()) return scoreOf(t,cfg).collected;
  return stepsDone(t,teamCourse(t,cfg));

function suiviTableHtml(tab, list){
